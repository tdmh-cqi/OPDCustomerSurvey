                                              {ratingsData.neutral > 0 && <span className="text-yellow-500 dark:text-yellow-400">{ratingsData.neutral}</span>}
                                              {ratingsData.sad > 0 && <span className="text-red-500 dark:text-red-400">{ratingsData.sad}</span>}
                                           </div>
                                        </>
                                     )}
                                  </div>

                                  {volumeViewMode === 'rate' ? (
                                      <div className={`w-full max-w-[4rem] rounded-t-xl transition-all duration-1000 ${isCurrent ? 'bg-gradient-to-t from-amber-500 to-amber-400 shadow-lg' : 'bg-slate-300 dark:bg-slate-600'}`} style={{ height: `${heightPctVolume}%`, minHeight: count > 0 ? '5%' : '4px' }}></div>
                                  ) : (
                                      <div className="w-full max-w-[4rem] flex flex-col justify-end gap-[1px] transition-all duration-700" style={{ height: `${totalHeightSentiment}%`, minHeight: ratingsData.total > 0 ? '5%' : '4px' }}>
                                         {ratingsData.happy > 0 && <div className="w-full bg-green-500 dark:bg-green-500 rounded-t-sm" style={{ height: `${(ratingsData.happy / maxSent) * 100}%`, minHeight: '2px' }}></div>}
                                         {ratingsData.neutral > 0 && <div className="w-full bg-yellow-400 dark:bg-yellow-400" style={{ height: `${(ratingsData.neutral / maxSent) * 100}%`, minHeight: '2px' }}></div>}
                                         {ratingsData.sad > 0 && <div className="w-full bg-red-500 dark:bg-red-500 rounded-b-sm" style={{ height: `${(ratingsData.sad / maxSent) * 100}%`, minHeight: '2px' }}></div>}
                                         {ratingsData.total === 0 && <div className="w-full h-[4px] bg-slate-200 dark:bg-slate-700 rounded-t-sm"></div>}
                                      </div>
                                  )}

                                  <div className={`text-[10px] sm:text-sm font-black mt-4 uppercase tracking-widest ${isCurrent ? 'text-amber-600 dark:text-amber-400' : 'text-slate-500 dark:text-slate-400'}`}>{label}</div>
                               </div>
                            )
                         })}
                      </div>

                      <div className="mt-8 flex flex-wrap items-center justify-center gap-4 sm:gap-8 text-sm font-bold text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-900/50 p-4 rounded-2xl border border-slate-100 dark:border-slate-800">
                         {volumeViewMode === 'rate' ? (
                            <>
                               <span className="flex items-center gap-3"><div className="w-4 h-4 bg-slate-300 dark:bg-slate-600 rounded-full shadow-inner"></div> Other Months</span>
                               <span className="flex items-center gap-3"><div className="w-4 h-4 bg-amber-500 rounded-full shadow-inner"></div> Selected Month</span>
                            </>
                         ) : (
                            <>
                               <span className="flex items-center gap-2"><div className="w-3 h-3 bg-green-500 rounded-sm"></div> Happy</span>
                               <span className="flex items-center gap-2"><div className="w-3 h-3 bg-yellow-400 rounded-sm"></div> Neutral</span>
                               <span className="flex items-center gap-2"><div className="w-3 h-3 bg-red-500 rounded-sm"></div> Sad</span>
                            </>
                         )}
                      </div>
                   </div>
                </div>
             )}

             {vaultTab === 'native_feedback' && (
                <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden flex flex-col animate-in fade-in slide-in-from-bottom-4">
                   <div className="p-6 bg-slate-50 dark:bg-slate-900/50 border-b border-slate-200 dark:border-slate-700 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                      <div>
                         <h3 className="font-black text-2xl text-slate-800 dark:text-white font-serif uppercase tracking-widest">{year} Raw Comments</h3>
                         <p className="text-amber-600 dark:text-amber-400 font-bold text-sm tracking-widest uppercase mt-1">Extracted from Google Forms Column</p>
                      </div>
                      <div className="flex items-center gap-3">
                         <label className="text-xs font-bold text-slate-500 uppercase tracking-widest">Filter by Month:</label>
                         <select className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg p-2 px-4 text-sm font-bold text-slate-800 dark:text-white outline-none focus:border-amber-500 shadow-sm cursor-pointer" value={overviewMonth} onChange={e => setOverviewMonth(e.target.value)}>
                            <option value="all">All Time ({year})</option>
                            {ALL_MONTHS_LABELS.map((m, i) => {
                               const mk = `${year}-${String(i+1).padStart(2,'0')}`;
                               return <option key={mk} value={mk}>{m} {year}</option>
                            })}
                         </select>
                      </div>
                   </div>
                   <div className="overflow-x-auto custom-scrollbar max-h-[600px] overflow-y-auto print:overflow-visible print:max-h-none report-table-wrapper">
                      <table className="w-full text-left table-fixed text-[10px] sm:text-xs print:text-[10px] break-words whitespace-normal">
                         <thead className="bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-black uppercase tracking-wider border-b-2 border-slate-200 dark:border-slate-700 sticky top-0 z-10 shadow-sm print:bg-transparent print:text-black">
                            <tr>
                               <th className="p-4 align-top w-[20%] border-r border-slate-100 dark:border-slate-700">Date</th>
                               <th className="p-4 align-top w-[30%] border-r border-slate-100 dark:border-slate-700">Patient Name</th>
                               <th className="p-4 align-top w-[50%]">Comments / Suggestions</th>
                            </tr>
                         </thead>
                         <tbody className="divide-y divide-slate-100 dark:divide-slate-700/50 text-slate-800 dark:text-slate-200 font-medium print:text-black">
                            {displayedComments.slice(0, visibleComments).map(c => (
                               <tr key={c.id} className="hover:bg-amber-50 dark:hover:bg-slate-700/50 transition-colors break-inside-avoid">
                                  <td className="p-4 align-top border-r border-slate-100 dark:border-slate-700 whitespace-nowrap">
                                     {isNaN(new Date(c.date).getTime()) ? c.date : new Date(c.date).toLocaleDateString('en-US')}
                                  </td>
                                  <td className="p-4 align-top border-r border-slate-100 dark:border-slate-700 font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                                     {c.name}
                                  </td>
                                  <td className="p-4 align-top italic leading-relaxed text-slate-700 dark:text-slate-300 break-words">
                                     "{c.text}"
                                  </td>
                               </tr>
                            ))}
                            {displayedComments.length === 0 && (
                               <tr><td colSpan="3" className="p-10 text-center text-slate-400 italic">No comments found for this selection.</td></tr>
                            )}
                         </tbody>
                      </table>
                      {visibleComments < displayedComments.length && (
                         <div className="p-6 text-center bg-slate-50 dark:bg-slate-900/50 border-t border-slate-200 dark:border-slate-700 no-print">
                            <button onClick={() => setVisibleComments(prev => prev + 100)} className="bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-white px-8 py-3 rounded-xl font-bold transition-colors shadow-sm">
                               Load More Comments ({displayedComments.length - visibleComments} remaining)
                            </button>
                         </div>
                      )}
                   </div>
                </div>
             )}

          </div>
       )
    }
function DrillDownModal({ drillDown, setDrillDown }) {
      const { type, data, questionText, viewMonth, patientData, allowedDeptIds } = drillDown;

      const allowedComments = useMemo(() => {
          if (type !== 'daily_comments' || !patientData?.departments) return [];
          return Object.entries(patientData.departments)
              .filter(([key, d]) => d.comment && d.comment.trim() !== '' && (!allowedDeptIds || allowedDeptIds.includes(key)))
              .map(([key, d]) => ({ title: d.title, comment: d.comment }));
      }, [type, patientData, allowedDeptIds]);

      return (
        <div className="fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-in fade-in duration-200 print:static print:bg-transparent print:p-0 print:block">
          <div className="bg-white dark:bg-slate-800 rounded-[2rem] shadow-2xl max-w-4xl w-full max-h-[90vh] flex flex-col overflow-hidden border border-slate-200 dark:border-slate-700 transition-colors print:max-h-none print:shadow-none print:border-none print:w-full print:block print:overflow-visible">

            <div className="bg-slate-900 dark:bg-slate-950 p-6 flex justify-between items-center text-white shrink-0 print:hidden">
              <div>
                <h3 className="font-bold text-xl font-serif">Detailed Insight</h3>
                {questionText && <p className="text-slate-400 text-sm mt-1">{questionText}</p>}
              </div>
              <div className="flex gap-4 items-center">
                <button onClick={() => window.print()} className="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 no-print"><Printer className="w-4 h-4" /> Print</button>
                <button onClick={() => setDrillDown(null)} className="text-slate-400 hover:text-white transition-colors no-print"><X className="w-6 h-6" /></button>
              </div>
            </div>

            <div className="p-8 overflow-y-auto custom-scrollbar bg-slate-50 dark:bg-slate-900 transition-colors print:overflow-visible print:h-auto print:block overscroll-contain print:p-0 print:bg-white">

              {type === 'daily_comments' && (
                 <div className="space-y-6">
                   <div className="flex items-center gap-4 mb-6">
                     <h4 className="text-2xl font-black text-slate-800 dark:text-white font-serif print:text-black">Patient Feedback Details</h4>
                   </div>

                   <div className="bg-blue-50 dark:bg-slate-900/50 p-6 rounded-2xl border border-blue-100 dark:border-slate-700 shadow-sm flex flex-col sm:flex-row gap-6 mb-6 print:border print:border-slate-300 print:bg-transparent">
                      <div className="flex-1">
                         <p className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1 print:text-slate-600">Patient Name</p>
                         <p className="text-xl font-black text-slate-800 dark:text-white print:text-black">{patientData?.general?.patient_name || 'Anonymous'}</p>
                      </div>
                      <div className="flex-1">
                         <p className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1 print:text-slate-600">Queue / Ticket Number</p>
                         <p className="text-xl font-black text-slate-800 dark:text-white print:text-black">{patientData?.general?.queue_number || patientData?.general?.room_number || 'N/A'}</p>
                      </div>
                      <div className="flex-1">
                         <p className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1 print:text-slate-600">Contact Details</p>
                         <p className="text-lg font-bold text-slate-700 dark:text-slate-300 print:text-black">{patientData?.general?.contact_info || 'Not Provided'}</p>
                      </div>
                   </div>

                   <div>
                      <h5 className="font-bold text-slate-700 dark:text-slate-300 uppercase tracking-widest text-sm mb-4 print:text-slate-800">Department Comments</h5>
                      <div className="grid grid-cols-1 gap-4">
                         {allowedComments.length === 0 ? (
                            <p className="text-slate-500 dark:text-slate-400 italic bg-white dark:bg-slate-800 p-6 border border-slate-200 dark:border-slate-700 rounded-xl text-center print:text-black print:border-slate-300 print:bg-transparent">
                               This patient did not leave any specific written feedback for your department.
                            </p>
                         ) : (
                            allowedComments.map((deptData, idx) => (
                               <div key={idx} className="bg-white dark:bg-slate-800 p-5 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm print:border print:border-slate-300 print:bg-transparent print:break-inside-avoid">
                                  <div className="bg-blue-100 dark:bg-slate-700 text-blue-800 dark:text-slate-300 px-3 py-1 rounded-lg font-black text-xs mb-3 inline-block uppercase tracking-wider print:bg-transparent print:border print:border-slate-400 print:text-black">{deptData.title}</div>
                                  <p className="text-slate-800 dark:text-slate-200 font-medium text-lg leading-relaxed print:text-black">"{deptData.comment}"</p>
                               </div>
                            ))
                         )}
                      </div>
                   </div>
                 </div>
              )}

              {type === 'general_question' && (
                 viewMonth ? (
                   <div className="space-y-6">
                      <div className="flex items-center gap-4 mb-6">
                        <button onClick={() => setDrillDown({...drillDown, viewMonth: null})} className="text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white bg-slate-200 dark:bg-slate-800 p-2 rounded-lg no-print transition-colors"><ArrowLeft className="w-5 h-5"/></button>
                        <h4 className="text-2xl font-black text-slate-800 dark:text-white font-serif print:text-black">Responses for {viewMonth}</h4>
                      </div>
                      {data.monthly[viewMonth].responses.length === 0 ? <p className="text-slate-500 dark:text-slate-400 italic print:text-black">No detailed responses found.</p> : (
                        <div className="grid grid-cols-1 gap-4">
                          {data.monthly[viewMonth].responses.map((resp, i) => (
                            <div key={i} className="bg-white dark:bg-slate-800 p-5 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm break-inside-avoid print:mb-4 print:border-slate-300 print:bg-transparent">
                              <div className="text-xs text-slate-500 dark:text-slate-400 font-bold mb-3 uppercase flex flex-wrap gap-x-3 gap-y-1 items-center print:text-slate-600">
                                 <span>{isNaN(new Date(resp.date).getTime()) ? resp.date : new Date(resp.date).toLocaleString('en-US', {month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit'})}</span>
                                 <span className="text-blue-500 hidden sm:inline print:text-slate-400">|</span>
                                 <span className="text-slate-600 dark:text-slate-300 print:text-black"><Users className="w-3 h-3 inline mr-1"/> {resp.name || 'Anonymous'}</span>
                                 <span className="text-blue-500 hidden sm:inline print:text-slate-400">|</span>
                                 <span className="text-slate-600 dark:text-slate-300 print:text-black">Queue: {resp.room || 'N/A'}</span>
                              </div>
                              {resp.isText ? (
                                <p className="text-slate-800 dark:text-slate-200 font-medium text-lg print:text-black">"{resp.value}"</p>
                              ) : (
                                <div className={`inline-block px-4 py-2 rounded-lg font-black text-lg print:bg-transparent print:border print:border-slate-400 print:text-black ${resp.value === 'Yes' ? 'bg-blue-100 dark:bg-blue-900/50 text-blue-800 dark:text-blue-300' : 'bg-slate-100 dark:bg-slate-700 text-slate-800 dark:text-slate-300'}`}>{resp.value}</div>
                              )}
                            </div>
                          ))}
                        </div>
                      )}
                   </div>
                 ) : (
                   <div>
                      <h4 className="text-2xl font-black text-slate-800 dark:text-white font-serif mb-6 print:text-black">Monthly Breakdown</h4>
                      <div className="space-y-4">
                        {Object.keys(data.monthly).sort().reverse().map(monthStr => {
                          const mData = data.monthly[monthStr];
                          return (
                            <div key={monthStr} onClick={() => setDrillDown({...drillDown, viewMonth: monthStr})} className="bg-white dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 hover:border-blue-300 dark:hover:border-blue-500 p-6 rounded-2xl cursor-pointer transition-colors shadow-sm group break-inside-avoid print:mb-4 print:bg-transparent print:border-slate-300">
                              <div className="flex justify-between items-center">
                                <span className="font-bold text-xl text-slate-700 dark:text-slate-200 print:text-black">{monthStr}</span>
                                <span className="text-sm font-bold text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 px-3 py-1 rounded-full group-hover:bg-blue-100 dark:group-hover:bg-blue-900/60 no-print transition-colors">View Responses <ChevronRight className="w-4 h-4 inline" /></span>
                              </div>
                              {!mData.isText && (
                                <div className="flex gap-8 mt-4">
                                  <div className="flex items-center gap-2 text-lg"><span className="w-4 h-4 rounded-full bg-blue-500 block shadow-inner print:bg-transparent print:border print:border-black"></span> <span className="font-bold text-slate-700 dark:text-slate-300 print:text-black">{mData.Yes || 0} Yes</span></div>
                                  <div className="flex items-center gap-2 text-lg"><span className="w-4 h-4 rounded-full bg-slate-300 dark:bg-slate-600 block shadow-inner print:bg-transparent print:border print:border-black"></span> <span className="font-bold text-slate-600 dark:text-slate-400 print:text-black">{mData.No || 0} No</span></div>
                                </div>
                              )}
                              {mData.isText && <div className="mt-4 text-slate-600 dark:text-slate-400 font-medium print:text-black">{mData.responses.length} written responses recorded.</div>}
                            </div>
                          )
                        })}
                      </div>
                   </div>
                 )
              )}
            </div>
          </div>
        </div>
      )
    }

    function HomeBanner({ onStartClick }) {
      return (
        <div className="flex flex-col items-center justify-center min-h-[70vh] animate-in fade-in zoom-in duration-500 mb-10">
          <div className="bg-white/95 dark:bg-slate-900/90 backdrop-blur-md p-8 sm:p-14 rounded-[2rem] shadow-2xl border border-white/50 dark:border-slate-700/50 max-w-xl w-full text-center relative overflow-hidden transition-colors">
            <div className="relative z-10">
              <div className="w-24 h-24 bg-gradient-to-br from-blue-600 to-indigo-800 dark:from-blue-500 dark:to-indigo-700 text-white rounded-3xl flex items-center justify-center mx-auto mb-8 shadow-xl shadow-blue-500/20 dark:shadow-blue-900/40 rotate-3 transform hover:rotate-0 transition-transform"><ClipboardList className="w-12 h-12 -rotate-3" /></div>
              <h2 className="text-3xl sm:text-4xl font-black text-slate-900 dark:text-white mb-4 tracking-tight leading-snug">OPD Patient Satisfaction Survey</h2>
              <p className="text-slate-600 dark:text-slate-300 mb-10 font-medium text-lg leading-relaxed">We value your health and your opinion. Please take a moment to rate your experience so we can serve you better.</p>
              <button onClick={onStartClick} className="w-full bg-gradient-to-r from-blue-600 to-indigo-700 hover:from-blue-700 hover:to-indigo-800 dark:from-blue-500 dark:to-indigo-600 dark:hover:from-blue-600 dark:hover:to-indigo-700 text-white font-bold py-5 px-6 rounded-2xl shadow-xl shadow-blue-500/30 transition-all active:scale-95 flex items-center justify-center gap-3 text-xl tracking-wide group border border-blue-500 dark:border-blue-400">
                Start Survey <ChevronRight className="w-7 h-7 group-hover:translate-x-1 transition-transform" />
              </button>
            </div>
          </div>
        </div>
      );
    }

    function SuccessModal({ onClose }) {
      return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-in fade-in duration-300">
          <div className="bg-white dark:bg-slate-800 p-8 sm:p-12 rounded-[2rem] shadow-2xl max-w-lg w-full text-center border border-slate-200 dark:border-slate-700 animate-in zoom-in-95 duration-500 transition-colors">
            <div className="w-24 h-24 bg-green-100 dark:bg-green-900/40 text-green-600 dark:text-green-400 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
              <Check className="w-12 h-12" />
            </div>
            <h3 className="text-3xl font-black text-slate-900 dark:text-white mb-4 font-serif">Thank You!</h3>
            <p className="text-slate-600 dark:text-slate-300 text-lg mb-8 leading-relaxed">
              Your feedback is invaluable to us. We have securely received your responses and will use them to continuously elevate the quality of care and service at Taytay Doctors Multispecialty Hospital.
            </p>
            <button onClick={onClose} className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-4 px-6 rounded-2xl transition-all shadow-md active:scale-95 text-lg border border-blue-500">
              Return to Home
            </button>
          </div>
        </div>
      )
    }

    function LoginSelectView({ loginMode, setView, setActiveDeptId, departments, flatDepartments, setAuthUser, setLoginToast }) {
      const loginableDepartments = flatDepartments.filter(d => {
         if (d.id === 'general') return true;
         if (d.parentId === 'general') return false;
         if (d.type === 'checkbox') return false;
         return true;
      });

      const [selectedDept, setSelectedDept] = useState(loginableDepartments.length > 0 ? loginableDepartments[0].id : '');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [error, setError] = useState('');
      const [isAuthenticating, setIsAuthenticating] = useState(false);

      const handleLogin = async (e) => {
        e.preventDefault();
        setIsAuthenticating(true);
        setError('');

        const id = loginMode === 'admin' ? 'admin' : selectedDept;
        const name = loginMode === 'admin' ? 'Master Admin' : loginableDepartments.find(d => d.id === selectedDept)?.title;

        try {
          const url = `${APPS_SCRIPT_URL}?action=login&id=${encodeURIComponent(id)}&name=${encodeURIComponent(name)}&password=${encodeURIComponent(password)}`;

          const res = await fetch(url);
          const data = await res.json();

          if (data.success) {
              setError('');
              const userObj = { role: loginMode, id: id, name: name };
              setAuthUser(userObj);
              localStorage.setItem('tdmh_opd_auth', JSON.stringify(userObj));

              setLoginToast(`Successfully logged in as ${name}`);
              setTimeout(() => setLoginToast(null), 4000);

              if (loginMode === 'admin') setView('admin'); else { setActiveDeptId(selectedDept); setView('dept'); }
          } else {
              setError(data.message || 'Incorrect Password');
          }
        } catch (err) {
          console.error("Login fetch error:", err);
          setError('Network error connecting to database.');
        }

        setIsAuthenticating(false);
      };

      return (
         <div className="flex flex-col items-center justify-center min-h-[60vh] animate-in fade-in duration-300">
            <div className="bg-white dark:bg-slate-800 p-8 rounded-[2rem] shadow-xl max-w-md w-full border border-slate-100 dark:border-slate-700 relative transition-colors">
               <button onClick={() => { setView('home'); setPassword(''); setError('');}} className="absolute top-6 left-6 text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 transition-colors"><ArrowLeft className="w-6 h-6"/></button>
               <div className="flex justify-center mb-4">
                  {loginMode === 'admin' ? <ShieldAlert className="w-12 h-12 text-red-600 dark:text-red-400" /> : <Users className="w-12 h-12 text-blue-600 dark:text-blue-400" />}
               </div>
               <h2 className="text-2xl font-black text-slate-800 dark:text-white mb-2 text-center tracking-tight">
                  {loginMode === 'admin' ? 'Master Admin Login' : 'Department Login'}
               </h2>
               <p className="text-center text-slate-500 dark:text-slate-400 mb-8 font-medium">Enter your secure credentials to access the portal.</p>

               <form onSubmit={handleLogin} className="space-y-5">
                  {loginMode === 'dept' && (
                     <div>
                        <label className="block text-xs font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2">Select Department</label>
                        <select className="w-full p-4 rounded-xl border-2 border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 dark:text-white font-medium outline-none focus:border-blue-500 transition-colors shadow-sm" value={selectedDept} onChange={(e) => setSelectedDept(e.target.value)}>
                           {loginableDepartments.map(d => <option key={d.id} value={d.id}>{d.type === 'sub' ? `— ${d.title}` : d.title}</option>)}
                        </select>
                     </div>
                  )}
                  <div>
                     <label className="block text-xs font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2">Password</label>
                     <div className="relative">
                       <input 
                          type={showPassword ? 'text' : 'password'} 
                          value={password} 
                          onChange={e => setPassword(e.target.value)} 
                          disabled={isAuthenticating} 
                          className="w-full p-4 pr-12 border-2 border-slate-200 dark:border-slate-600 dark:bg-slate-900 dark:text-white rounded-xl outline-none focus:border-blue-500 text-lg disabled:opacity-50 transition-colors shadow-sm" 
                          placeholder="Enter Password" 
                          autoFocus 
                       />
                       <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-4 top-1/2 transform -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 outline-none">
                          {showPassword ? <EyeOff className="w-6 h-6"/> : <Eye className="w-6 h-6"/>}
                       </button>
                     </div>
                  </div>

                  {error && <p className="text-red-500 dark:text-red-400 text-sm mt-2 font-bold flex items-center gap-1 bg-red-50 dark:bg-red-900/30 p-3 rounded-lg"><AlertTriangle className="w-4 h-4"/>{error}</p>}

                  <button type="submit" disabled={isAuthenticating} className={`w-full text-white font-black py-4 rounded-xl text-lg transition-colors active:scale-95 flex justify-center items-center gap-2 disabled:opacity-70 shadow-md mt-4 border ${loginMode === 'admin' ? 'bg-red-600 hover:bg-red-700 border-red-500' : 'bg-blue-600 hover:bg-blue-700 border-blue-500'}`}>
                     {isAuthenticating ? <><RefreshCw className="w-5 h-5 animate-spin" /> Verifying...</> : 'Unlock Portal'}
                  </button>
               </form>
            </div>
         </div>
      )
    }

    function PatientSurvey({ onSubmit, intakeQuestions, activeDepartments, departments, isSubmitting, setView }) {
      const availableDepartments = departments.filter(dept => activeDepartments[dept.id]);
      const [isLocked, setIsLocked] = useState(false);

      const [surveyData, setSurveyData] = useState({
         general: {},
         departments: availableDepartments.reduce((acc, dept) => {
            acc[dept.id] = { skipped: true, selectedServices: [], answers: {}, comments: {}, comment: "" };
            return acc;
         }, {})
      });

      const handleIntakeChange = (e) => {
        setSurveyData(prev => ({ ...prev, general: { ...prev.general, [e.target.name]: e.target.value } }));
      };

      const handleRating = (deptId, qId, score) => {
        setSurveyData(prev => ({
          ...prev, departments: { ...prev.departments, [deptId]: { ...prev.departments[deptId], skipped: false, answers: { ...prev.departments[deptId]?.answers, [qId]: score } } }
        }));
      };

      const handleComment = (deptId, text) => {
        setSurveyData(prev => ({
          ...prev, departments: { ...prev.departments, [deptId]: { ...prev.departments[deptId], comment: text } }
        }));
      };

      const handleServiceRating = (deptId, service, score) => {
        setSurveyData(prev => ({
          ...prev, departments: { ...prev.departments, [deptId]: { ...prev.departments[deptId], skipped: false, answers: { ...prev.departments[deptId]?.answers, [service]: score } } }
        }));
      };

      const handleServiceComment = (deptId, service, text) => {
        setSurveyData(prev => ({
          ...prev, departments: { ...prev.departments, [deptId]: { ...prev.departments[deptId], comments: { ...prev.departments[deptId]?.comments, [service]: text } } }
        }));
      };

      const toggleService = (deptId, service) => {
        setSurveyData(prev => {
          const currentServices = prev.departments[deptId]?.selectedServices || [];
          const newServices = currentServices.includes(service) ? currentServices.filter(s => s !== service) : [...currentServices, service];
          const newAnswers = { ...prev.departments[deptId]?.answers };
          const newComments = { ...prev.departments[deptId]?.comments };
          if (!newServices.includes(service)) { delete newAnswers[service]; delete newComments[service]; }

          return { ...prev, departments: { ...prev.departments, [deptId]: { ...prev.departments[deptId], selectedServices: newServices, answers: newAnswers, comments: newComments } } }
        });
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (isSubmitting || isLocked) return;
        setIsLocked(true);

        const flattenedDepartments = {};

        Object.keys(surveyData.departments).forEach(deptId => {
            const dData = surveyData.departments[deptId];
            const deptDef = departments.find(d => d.id === deptId);

            if (deptDef && deptDef.type === 'checkbox') {
                if (dData.selectedServices && dData.selectedServices.length > 0) {
                    let hasRatings = false;
                    dData.selectedServices.forEach(svc => {
                        if (dData.answers && dData.answers[svc]) {
                            hasRatings = true;
                            const virtualId = `${deptId}_${svc}`;
                            flattenedDepartments[virtualId] = {
                                title: `${deptDef.title} (${svc})`,
                                skipped: false,
                                selectedServices: [svc],
                                answers: { "q1": dData.answers[svc] },
                                comment: dData.comments ? dData.comments[svc] || "" : ""
                            };
                        }
                    });

                    if (!hasRatings) {
                        flattenedDepartments[deptId] = { title: deptDef.title, skipped: true, selectedServices: dData.selectedServices };
                    }
                } else {
                    flattenedDepartments[deptId] = { title: deptDef.title, skipped: true, selectedServices: [] };
                }
            } else {
                if (Object.keys(dData.answers || {}).length === 0) { dData.skipped = true; }
                flattenedDepartments[deptId] = dData;
            }
        });

        onSubmit({ general: surveyData.general, departments: flattenedDepartments, intakeQuestions: intakeQuestions });
      };

      return (
        <div className="max-w-4xl mx-auto animate-in fade-in duration-500">
          <form onSubmit={handleSubmit} className="space-y-6 sm:space-y-10 pb-20">
            <div className="bg-white/95 dark:bg-slate-800/95 sm:rounded-[2rem] shadow-xl overflow-hidden border-t-8 border-blue-600 dark:border-blue-500 sm:border sm:border-white/50 dark:sm:border-slate-700/50 backdrop-blur-md">
              <div className="bg-blue-50 dark:bg-slate-900/50 p-6 sm:p-10 border-b border-blue-100 dark:border-slate-700 flex items-center justify-between">
                <div>
                  <h2 className="text-2xl sm:text-3xl font-bold font-serif text-blue-900 dark:text-blue-300">Patient Details</h2>
                  <p className="text-blue-700 dark:text-blue-400/80 mt-1 font-medium">Please provide your visit information.</p>
                </div>
                <button type="button" onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} className="text-sm font-bold text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-white bg-white dark:bg-slate-800 px-4 py-2 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 flex items-center gap-2 transition-colors"><ArrowLeft className="w-4 h-4"/> Back to Top</button>
              </div>
              <div className="p-6 sm:p-10 grid grid-cols-1 md:grid-cols-2 gap-6">
                {intakeQuestions.map((q) => (
                  <div key={q.id} className="space-y-3">
                    <label className="block text-slate-700 dark:text-slate-300 font-bold text-lg">{q.text} {q.required && <span className="text-red-500 dark:text-red-400">*</span>}</label>
                    <input 
                       type={q.type === 'date' ? 'date' : 'text'} 
                       name={q.id} 
                       required={q.required} 
                       onChange={handleIntakeChange} 
                       className="w-full border-2 border-slate-200 dark:border-slate-700 rounded-xl p-4 focus:ring-2 focus:ring-blue-200 dark:focus:ring-blue-800 focus:border-blue-500 dark:focus:border-blue-500 outline-none font-medium text-slate-700 dark:text-white bg-slate-50 dark:bg-slate-900/50 focus:bg-white dark:focus:bg-slate-900 transition-colors shadow-sm" 
                    />
                  </div>
                ))}
              </div>
            </div>

            <div className="px-4 sm:px-0 space-y-4 sm:space-y-8">
              <div className="text-center py-6">
                 <h2 className="text-3xl sm:text-4xl font-black text-slate-800 dark:text-white font-serif mb-3 tracking-tight">Rate Your Experience</h2>
                 <p className="text-slate-600 dark:text-slate-400 text-lg font-medium">Tap the face that best describes your experience. <br className="hidden sm:block"/> <span className="font-bold text-blue-600 dark:text-blue-400">Skip any departments you did not visit.</span></p>
              </div>

              {availableDepartments.map((dept) => (
                <div key={dept.id} className="bg-white dark:bg-slate-800 sm:rounded-[2rem] shadow-lg border border-slate-200 dark:border-slate-700 overflow-hidden transform transition-all hover:shadow-xl -mx-4 sm:mx-0">
                  <div className="bg-slate-900 dark:bg-slate-950 text-white p-5 sm:p-6 font-bold text-xl flex items-center gap-3">
                     <Star className="w-6 h-6 text-amber-400" /> {dept.title}
                  </div>
                  <div className="p-5 sm:p-8 space-y-8">

                    {dept.type === 'checkbox' && (
                      <div className="space-y-6">
                         <div className="bg-blue-50/50 dark:bg-slate-900/50 p-6 rounded-2xl border border-blue-100 dark:border-slate-700">
                           <p className="font-bold text-slate-700 dark:text-slate-300 mb-4 text-lg">Please tick/check all the services you have encountered:</p>
                           <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                             {(dept.services || []).map(service => {
                               const isChecked = surveyData.departments[dept.id]?.selectedServices?.includes(service);
                               return (
                                 <div key={service} onClick={() => toggleService(dept.id, service)} className={`flex items-center gap-4 p-4 rounded-xl border-2 cursor-pointer transition-all ${isChecked ? 'bg-blue-600 border-blue-600 text-white shadow-md' : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300 hover:border-blue-300 dark:hover:border-blue-500'}`}>
                                   <div className={`w-8 h-8 rounded-lg border-2 flex items-center justify-center shrink-0 transition-colors ${isChecked ? 'border-white bg-blue-500' : 'border-slate-300 dark:border-slate-500 bg-slate-50 dark:bg-slate-700'}`}>
                                      {isChecked && <Check className="w-5 h-5 text-white" />}
                                   </div>
                                   <span className="font-bold text-lg">{service}</span>
                                 </div>
                               )
                             })}
                           </div>
                         </div>

                         {surveyData.departments[dept.id]?.selectedServices?.map(svc => {
                            const ans = surveyData.departments[dept.id]?.answers?.[svc];
                            return (
                              <div key={svc} className="bg-white dark:bg-slate-800 p-6 sm:p-8 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm animate-in fade-in slide-in-from-top-4">
                                 <p className="text-xl sm:text-2xl font-bold text-slate-800 dark:text-white leading-snug mb-6">How was your experience with <span className="text-blue-600 dark:text-blue-400">{svc}</span> and the staff(s)?</p>
                                 <div className="flex justify-between sm:justify-start sm:gap-6">
                                    <button type="button" onClick={() => handleServiceRating(dept.id, svc, 3)} className={`flex-1 sm:flex-none sm:w-32 flex flex-col items-center gap-2 p-4 sm:p-6 rounded-2xl border-4 transition-all active:scale-95 ${ans === 3 ? 'bg-green-500 border-green-500 text-white shadow-lg scale-105' : 'bg-white dark:bg-slate-800 border-slate-100 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:border-green-200 dark:hover:border-green-800 hover:bg-green-50 dark:hover:bg-green-900/20'}`}>
                                      <span className="text-5xl sm:text-6xl drop-shadow-sm">😁</span>
                                      <span className="font-black tracking-wide text-sm sm:text-base">Happy</span>
                                    </button>
                                    <button type="button" onClick={() => handleServiceRating(dept.id, svc, 2)} className={`flex-1 sm:flex-none sm:w-32 flex flex-col items-center gap-2 p-4 sm:p-6 rounded-2xl border-4 transition-all active:scale-95 ${ans === 2 ? 'bg-yellow-400 border-yellow-400 text-white shadow-lg scale-105' : 'bg-white dark:bg-slate-800 border-slate-100 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:border-yellow-200 dark:hover:border-yellow-800 hover:bg-yellow-50 dark:hover:bg-yellow-900/20'}`}>
                                      <span className="text-5xl sm:text-6xl drop-shadow-sm">😐</span>
                                      <span className="font-black tracking-wide text-sm sm:text-base">Neutral</span>
                                    </button>
                                    <button type="button" onClick={() => handleServiceRating(dept.id, svc, 1)} className={`flex-1 sm:flex-none sm:w-32 flex flex-col items-center gap-2 p-4 sm:p-6 rounded-2xl border-4 transition-all active:scale-95 ${ans === 1 ? 'bg-red-500 border-red-500 text-white shadow-lg scale-105' : 'bg-white dark:bg-slate-800 border-slate-100 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:border-red-200 dark:hover:border-red-900 hover:bg-red-50 dark:hover:bg-red-900/20'}`}>
                                      <span className="text-5xl sm:text-6xl drop-shadow-sm">😢</span>
                                      <span className="font-black tracking-wide text-sm sm:text-base">Sad</span>
                                    </button>
                                 </div>
                                 <div className="pt-6 mt-6 border-t border-slate-100 dark:border-slate-700 animate-in fade-in slide-in-from-top-4">
                                   <textarea 
                                      onChange={(e) => handleServiceComment(dept.id, svc, e.target.value)} 
                                      className="w-full border-2 border-slate-200 dark:border-slate-700 focus:border-blue-400 dark:focus:border-blue-500 rounded-2xl p-4 sm:p-5 outline-none resize-none bg-slate-50 dark:bg-slate-900/50 focus:bg-white dark:focus:bg-slate-900 text-slate-700 dark:text-white font-medium transition-colors shadow-sm" 
                                      rows="2" 
                                      placeholder={`Any comments or suggestions for ${svc}? (Optional)`}
                                   ></textarea>
                                 </div>
                              </div>
                            )
                         })}
                      </div>
                    )}

                    {dept.type !== 'checkbox' && (dept.questions || []).map((q) => {
                      const ans = surveyData.departments[dept.id]?.answers?.[q.id];
                      return (
                        <div key={q.id} className="space-y-6">
                          <p className="text-xl sm:text-2xl font-bold text-slate-800 dark:text-white leading-snug">{q.text}</p>
                          <div className="flex justify-between sm:justify-start sm:gap-6">
                            <button type="button" onClick={() => handleRating(dept.id, q.id, 3)} className={`flex-1 sm:flex-none sm:w-32 flex flex-col items-center gap-2 p-4 sm:p-6 rounded-2xl border-4 transition-all active:scale-95 ${ans === 3 ? 'bg-green-500 border-green-500 text-white shadow-lg scale-105' : 'bg-white dark:bg-slate-800 border-slate-100 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:border-green-200 dark:hover:border-green-800 hover:bg-green-50 dark:hover:bg-green-900/20'}`}>
                              <span className="text-5xl sm:text-6xl drop-shadow-sm">😁</span>
                              <span className="font-black tracking-wide text-sm sm:text-base">Happy</span>
                            </button>
                            <button type="button" onClick={() => handleRating(dept.id, q.id, 2)} className={`flex-1 sm:flex-none sm:w-32 flex flex-col items-center gap-2 p-4 sm:p-6 rounded-2xl border-4 transition-all active:scale-95 ${ans === 2 ? 'bg-yellow-400 border-yellow-400 text-white shadow-lg scale-105' : 'bg-white dark:bg-slate-800 border-slate-100 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:border-yellow-200 dark:hover:border-yellow-800 hover:bg-yellow-50 dark:hover:bg-yellow-900/20'}`}>
                              <span className="text-5xl sm:text-6xl drop-shadow-sm">😐</span>
                              <span className="font-black tracking-wide text-sm sm:text-base">Neutral</span>
                            </button>
                            <button type="button" onClick={() => handleRating(dept.id, q.id, 1)} className={`flex-1 sm:flex-none sm:w-32 flex flex-col items-center gap-2 p-4 sm:p-6 rounded-2xl border-4 transition-all active:scale-95 ${ans === 1 ? 'bg-red-500 border-red-500 text-white shadow-lg scale-105' : 'bg-white dark:bg-slate-800 border-slate-100 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:border-red-200 dark:hover:border-red-900 hover:bg-red-50 dark:hover:bg-red-900/20'}`}>
                              <span className="text-5xl sm:text-6xl drop-shadow-sm">😢</span>
                              <span className="font-black tracking-wide text-sm sm:text-base">Sad</span>
                            </button>
                          </div>
                        </div>
                      )
                    })}

                    {dept.type !== 'checkbox' && (
                      <div className="pt-4 border-t border-slate-100 dark:border-slate-700 animate-in fade-in slide-in-from-top-4">
                        <textarea 
                           onChange={(e) => handleComment(dept.id, e.target.value)} 
                           className="w-full border-2 border-slate-200 dark:border-slate-700 focus:border-blue-400 dark:focus:border-blue-500 rounded-2xl p-4 sm:p-5 outline-none resize-none bg-slate-50 dark:bg-slate-900/50 focus:bg-white dark:focus:bg-slate-900 text-slate-700 dark:text-white font-medium transition-colors shadow-sm" 
                           rows="2" 
                           placeholder={`Any comments or suggestions for ${dept.title}? (Optional)`}
                        ></textarea>
                      </div>
                    )}

                  </div>
                </div>
              ))}
            </div>

            <div className="bg-slate-900 dark:bg-slate-950 text-white sm:rounded-[2rem] shadow-2xl overflow-hidden -mx-4 sm:mx-0 mt-12 border border-slate-800 dark:border-slate-800">
              <div className="p-6 sm:p-10 border-b border-slate-800 text-center">
                <h2 className="text-3xl sm:text-4xl font-black font-serif tracking-tight">Overall Experience</h2>
                <p className="text-slate-400 mt-2 text-lg font-medium">Help us understand the bigger picture.</p>
              </div>
              <div className="p-6 sm:p-10 space-y-8 bg-slate-800/50 dark:bg-slate-900/50">
                {GENERAL_QUESTIONS.map((q) => (
                  <div key={q.id} className="space-y-4 bg-slate-900/80 p-6 rounded-2xl border border-slate-700 shadow-sm">
                    <label className="block text-white font-bold text-lg leading-snug">
                      {q.text} {q.required && <span className="text-red-400">*</span>}
                    </label>
                    {q.type === 'yesno' ? (
                      <div className="flex gap-4">
                        <label className="flex items-center justify-center gap-2 cursor-pointer bg-slate-800 hover:bg-blue-900 border-2 border-slate-700 hover:border-blue-500 py-4 px-6 rounded-xl flex-1 transition-all shadow-sm"><input type="radio" name={q.id} value="Yes" required={q.required} onChange={handleIntakeChange} className="w-5 h-5 accent-blue-500" /><span className="font-bold text-white text-lg">Yes</span></label>
                        <label className="flex items-center justify-center gap-2 cursor-pointer bg-slate-800 hover:bg-slate-700 border-2 border-slate-700 hover:border-slate-500 py-4 px-6 rounded-xl flex-1 transition-all shadow-sm"><input type="radio" name={q.id} value="No" required={q.required} onChange={handleIntakeChange} className="w-5 h-5 accent-slate-500" /><span className="font-bold text-white text-lg">No</span></label>
                      </div>
                    ) : q.type === 'compare' ? (
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <label className="flex flex-col items-center justify-center gap-2 cursor-pointer bg-slate-800 hover:bg-green-900 border-2 border-slate-700 hover:border-green-500 p-4 rounded-xl transition-all shadow-sm group">
                          <input type="radio" name={q.id} value="Superior" required={q.required} onChange={handleIntakeChange} className="w-5 h-5 accent-green-500 mb-2" />
                          <span className="font-bold text-white text-lg">Superior</span>
                        </label>
                        <label className="flex flex-col items-center justify-center gap-2 cursor-pointer bg-slate-800 hover:bg-yellow-900 border-2 border-slate-700 hover:border-yellow-500 p-4 rounded-xl transition-all shadow-sm group">
                          <input type="radio" name={q.id} value="At Par" required={q.required} onChange={handleIntakeChange} className="w-5 h-5 accent-yellow-500 mb-2" />
                          <span className="font-bold text-white text-lg">At Par</span>
                        </label>
                        <label className="flex flex-col items-center justify-center gap-2 cursor-pointer bg-slate-800 hover:bg-red-900 border-2 border-slate-700 hover:border-red-500 p-4 rounded-xl transition-all shadow-sm group">
                          <input type="radio" name={q.id} value="Inferior" required={q.required} onChange={handleIntakeChange} className="w-5 h-5 accent-red-500 mb-2" />
                          <span className="font-bold text-white text-lg">Inferior</span>
                        </label>
                      </div>
                    ) : ( 
                      <textarea name={q.id} rows={3} required={q.required} onChange={handleIntakeChange} className="w-full border-2 border-slate-700 rounded-xl p-4 outline-none resize-none font-medium text-white bg-slate-800 focus:border-blue-500 focus:bg-slate-900 transition-colors shadow-inner" placeholder="Type your answer here..."></textarea> 
                    )}
                  </div>
                ))}

                <div className="pt-8">
                  <button type="submit" disabled={isSubmitting || isLocked} className="w-full bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-black py-6 px-6 rounded-2xl shadow-xl transition-all active:scale-95 flex items-center justify-center gap-3 text-2xl disabled:opacity-50 border border-blue-400">
                     {isSubmitting || isLocked ? 'Submitting securely...' : 'Submit Survey'} <Send className="w-8 h-8" />
                  </button>
                  <p className="text-center text-slate-500 mt-4 text-sm font-bold tracking-wide">Your responses are secure and confidential.</p>
                </div>

              </div>
            </div>

          </form>
        </div>
      );
    }

    function QRGenerator() {
      const currentUrl = window.location.href.split('?')[0]; 
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=${encodeURIComponent(currentUrl)}`;

      return (
        <div className="space-y-6 animate-in slide-in-from-bottom-2 w-full h-full flex flex-col items-center">
           <div className="w-full max-w-4xl flex justify-between items-center bg-white/90 dark:bg-slate-800/90 backdrop-blur-sm p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-md no-print transition-colors">
             <div><h3 className="font-bold text-xl text-slate-900 dark:text-white">QR Code Scanner</h3><p className="text-slate-500 dark:text-slate-400 text-sm mt-1">Ready for Portrait Printing. Tape this to the wall or desk.</p></div>
             <button onClick={() => window.print()} className="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold shadow-md hover:bg-blue-700 flex items-center gap-2"><Printer className="w-5 h-5" /> Print Portrait Poster</button>
           </div>

           <div className="print-qr-poster bg-slate-50 dark:bg-slate-900 w-full flex flex-col items-center justify-center relative sm:border border-slate-200 dark:border-slate-800 sm:rounded-3xl sm:min-h-[75vh] overflow-hidden transition-colors print:p-0 print:border-none print:bg-transparent">

              <div className="absolute inset-0 z-0 opacity-20 dark:opacity-10 pointer-events-none no-print" style={{backgroundImage: `url('${BACKGROUND_URL}')`, backgroundSize: 'cover', backgroundPosition: 'center'}} />

              <div className="print-qr-card-wrapper relative z-10 w-full max-w-[600px] print:max-w-[100%] mx-auto">
                  <div className="flex flex-col items-center text-center w-full bg-white dark:bg-slate-800 rounded-[3rem] shadow-2xl p-8 sm:p-12 border-4 border-slate-200 dark:border-slate-700 print:shadow-none print:border-0 mt-12 print:mt-0">

                    <div className="bg-white px-6 py-4 rounded-[2rem] shadow-xl border-4 border-slate-50 dark:border-slate-700 -mt-20 sm:-mt-24 print:-mt-10 mb-6 inline-block">
                      <img src={LOGO_URL} alt="Taytay Doctors Logo" className="h-20 sm:h-24 w-auto object-contain drop-shadow-sm" />
                    </div>

                    <h2 className="text-blue-600 dark:text-blue-400 font-bold tracking-widest uppercase mb-2 text-md">We Value Your Feedback</h2>
                    <h1 className="text-4xl sm:text-5xl font-black text-slate-900 dark:text-white mb-4 tracking-tight leading-tight uppercase font-serif drop-shadow-sm">Patient Survey</h1>

                    <p className="text-base sm:text-lg text-slate-600 dark:text-slate-300 mb-8 font-medium leading-relaxed px-2">Please let us know how we did today. Your input helps us continuously improve our quality of care.</p>

                    <div className="bg-white p-4 rounded-[2rem] shadow-2xl border-4 border-blue-500 inline-block mb-8">
                       <img src={qrUrl} alt="QR Code" className="w-56 h-56 sm:w-64 sm:h-64 object-contain" />
                    </div>

                    <div className="grid grid-cols-3 gap-2 sm:gap-4 text-left w-full mb-4 mx-auto">
                        <div className="flex flex-col items-center text-center space-y-2">
                            <div className="w-10 h-10 rounded-full bg-blue-100 dark:bg-slate-700 text-blue-700 dark:text-blue-400 flex items-center justify-center font-black text-lg shadow-inner border border-blue-200 dark:border-slate-600">1</div>
                            <p className="text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-200 uppercase tracking-wide">Open<br/>Camera</p>
                        </div>
                        <div className="flex flex-col items-center text-center space-y-2">
                            <div className="w-10 h-10 rounded-full bg-blue-100 dark:bg-slate-700 text-blue-700 dark:text-blue-400 flex items-center justify-center font-black text-lg shadow-inner border border-blue-200 dark:border-slate-600">2</div>
                            <p className="text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-200 uppercase tracking-wide">Scan<br/>QR Code</p>
                        </div>
                        <div className="flex flex-col items-center text-center space-y-2">
                            <div className="w-10 h-10 rounded-full bg-blue-100 dark:bg-slate-700 text-blue-700 dark:text-blue-400 flex items-center justify-center font-black text-lg shadow-inner border border-blue-200 dark:border-slate-600">3</div>
                            <p className="text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-200 uppercase tracking-wide">Tap<br/>To Start</p>
                        </div>
                    </div>

                    <div className="text-slate-400 font-bold text-xs flex items-center justify-center gap-4 w-full uppercase tracking-widest mt-6">
                      <span className="flex-1 h-px bg-slate-200 dark:bg-slate-700"></span> 
                      Thank You 
                      <span className="flex-1 h-px bg-slate-200 dark:bg-slate-700"></span>
                    </div>
                  </div>
              </div>
           </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
