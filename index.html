  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='35' cy='25' r='6' fill='%2316a34a'/><circle cx='55' cy='18' r='6' fill='%2316a34a'/><circle cx='75' cy='25' r='6' fill='%2316a34a'/><path d='M40 35 v45 h15 a22.5 22.5 0 0 0 0 -45 h-15' fill='none' stroke='%231d4ed8' stroke-width='16' stroke-linecap='square'/><path d='M40 30 v55 M20 50 q20 -15 20 0 q0 -15 20 0' fill='none' stroke='%23eab308' stroke-width='10' stroke-linecap='round'/></svg>">

  <script type="importmap">
    {
      "imports": {

        "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",

<body class="transition-colors duration-300 bg-slate-50 dark:bg-slate-900">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { 
      ClipboardList, LayoutDashboard, ChevronRight, SkipForward, 
      ThumbsUp, MessageSquare, Star, ArrowLeft, Settings, 
      UserCheck, AlertTriangle, Send, Lock, BarChart, QrCode, Printer, 
      BarChart3, Plus, Edit2, TrendingUp, TrendingDown, HeartHandshake, X, CalendarDays, RefreshCw, Save, Check, Moon, Sun,
      LogOut, Inbox, Scale, Trash2, Clock, Mail, CheckCircle2, ClipboardCheck, ListFilter, Users, ShieldAlert, FileText, Lightbulb,
      Eye, EyeOff, ExternalLink, Database, Maximize2, ChevronDown, ChevronUp
    } from 'lucide-react';

    const FORM_CONTROL_NO = "TDMH-OPD-F-001";
    const GITHUB_BASE_URL = "https://raw.githubusercontent.com/tdmh-cqi/OPDCustomerSurvey/main/images";
    const LOGO_URL = `${GITHUB_BASE_URL}/tdmh-logo.png`;
    const BACKGROUND_URL = `${GITHUB_BASE_URL}/tdmh-background.jpg`;

    // IMPORTANT: Paste your new Google Apps Script Web App URL here
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxqI5rCFVuOGonD6ujY-Al8lXAburlRQnmLTay9oJQE-FH-F6xEvm4kAszmRjIrWXB8pw/exec"; 

    const DEFAULT_DEPARTMENTS = [
      { id: 'yakap', title: 'YAKAP', type: 'standard', questions: [{ id: 'yakap_1', text: 'How was your experience with this department and the staff(s)?' }] },
      { id: 'billing', title: 'Billing', type: 'standard', questions: [{ id: 'bil_1', text: 'How was your experience with this department and the staff(s)?' }] },
      { id: 'cashier', title: 'Cashier', type: 'standard', questions: [{ id: 'cas_1', text: 'How was your experience with this department and the staff(s)?' }] },
      { id: 'ctscan', title: 'CT-Scan', type: 'standard', questions: [{ id: 'ct_1', text: 'How was your experience with this department and the staff(s)?' }] },
      { id: 'er', title: 'Emergency Care', type: 'standard', questions: [{ id: 'er_1', text: 'How was your experience with this department and the staff(s)?' }] },
      { id: 'heart', title: 'Heart Station', type: 'standard', questions: [{ id: 'heart_1', text: 'How was your experience with this department and the staff(s)?' }] },
      { id: 'lab', title: 'Laboratory', type: 'standard', questions: [{ id: 'lab_1', text: 'How was your experience with this department and the staff(s)?' }] },
      { id: 'opd', title: 'OPD', type: 'standard', questions: [{ id: 'opd_1', text: 'How was your experience with this department and the staff(s)?' }] },
      { id: 'pharmacy', title: 'Pharmacy', type: 'standard', questions: [{ id: 'phar_1', text: 'How was your experience with this department and the staff(s)?' }] },
      { id: 'philhealth', title: 'Philhealth', type: 'standard', questions: [{ id: 'phi_1', text: 'How was your experience with this department and the staff(s)?' }] },
      { id: 'ekonsulta', title: 'Philhealth EKonsulta', type: 'standard', questions: [{ id: 'ekon_1', text: 'How was your experience with this department and the staff(s)?' }] },
      { id: 'rehab', title: 'Physical Medicine & Rehabilitation Center', type: 'standard', questions: [{ id: 'rehab_1', text: 'How was your experience with this department and the staff(s)?' }] },
      { id: 'ultrasound', title: 'Ultra Sound', type: 'standard', questions: [{ id: 'ultra_1', text: 'How was your experience with this department and the staff(s)?' }] },
      { id: 'radiology', title: 'Radiology', type: 'standard', questions: [{ id: 'rad_1', text: 'How was your experience with this department and the staff(s)?' }] },
      { id: 'homes', title: 'HOMES', type: 'standard', questions: [{ id: 'homes_1', text: 'How was your experience with this department and the staff(s)?' }] },
      { id: 'hmo_opd', title: 'HMO OPD', type: 'standard', questions: [{ id: 'hmo_1', text: 'How was your experience with this department and the staff(s)?' }] },
      { id: 'mss', title: 'Medical Social Services', type: 'standard', questions: [{ id: 'mss_1', text: 'How was your experience with this department and the staff(s)?' }] }
    ];

    const DEFAULT_INTAKE_QUESTIONS = [
      { id: 'patient_name', text: 'Patient Name', type: 'short_text', required: true },
      { id: 'queue_number', text: 'Queue / Ticket Number', type: 'short_text', required: true },
      { id: 'contact_info', text: 'Email Address / Contact No. (Optional)', type: 'short_text', required: false }
    ];

    const GENERAL_QUESTIONS = [
      { id: 'gen_1', text: 'Is this your first time having a consultation here?', type: 'yesno', required: true },
      { id: 'gen_2', text: 'Have you visited another clinic or hospital for this?', type: 'yesno', required: true },
      { id: 'gen_3', text: 'How do you compare Taytay Doctors Multispecialty Hospital to other clinics/hospitals?', type: 'compare', required: true },
      { id: 'gen_4', text: 'Do you want to receive health tips and service updates from Taytay Doctors?', type: 'yesno', required: true },
      { id: 'gen_5', text: 'Would you recommend our hospital to your family and friends?', type: 'yesno', required: true },
      { id: 'gen_6', text: 'Generally, were you satisfied with our services?', type: 'yesno', required: true }
    ];

    const getMonthString = (dateObj) => {
        if (isNaN(dateObj.getTime())) return "Unknown";
        return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}`;
    };
    const ALL_MONTHS_LABELS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    const getFlatDepartments = (depts) => {
        let flat = [];
        depts.forEach(d => {
            flat.push(d); 
            if (d.type === 'checkbox' && d.services) {
                d.services.forEach(svc => {
                    const subTitle = d.subTitles ? d.subTitles[svc] : `${d.title} (${svc})`;
                    flat.push({ id: `${d.id}_${svc}`, title: subTitle, type: 'sub', parentId: d.id });
                });
            }
        });
        return flat;
    };

    const VERSION_KEY = "tdmh_opd_v1";
function App() {
      const [view, setView] = useState('home'); 
      const [activeDeptId, setActiveDeptId] = useState(null); 
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [showSuccess, setShowSuccess] = useState(false);
      const [isSyncing, setIsSyncing] = useState(false);
      const [drillDown, setDrillDown] = useState(null); 
      const [surveyKey, setSurveyKey] = useState(0); 
      const [confirmSync, setConfirmSync] = useState(false);
      const [loginMode, setLoginMode] = useState(null);
      const [printOrientation, setPrintOrientation] = useState('landscape');
      const [iframeUrl, setIframeUrl] = useState(null);
      const [updateAvailable, setUpdateAvailable] = useState(false);
      const isSubmittingRef = useRef(false);

      const [authUser, setAuthUser] = useState(() => {
         try { return JSON.parse(localStorage.getItem('tdmh_opd_auth')) || null; } catch(e) { return null; }
      });
      const [loginToast, setLoginToast] = useState(null);

      const [commentCats, setCommentCats] = useState(() => {
         try { return JSON.parse(localStorage.getItem('tdmh_opd_comment_cats')) || {}; } catch(e) { return {}; }
      });
      useEffect(() => localStorage.setItem('tdmh_opd_comment_cats', JSON.stringify(commentCats)), [commentCats]);

      const [isDark, setIsDark] = useState(() => {
        const savedTheme = localStorage.getItem('tdmh_opd_theme');
        return savedTheme === 'dark';
      });

      useEffect(() => {
        if (view === 'qr') setPrintOrientation('portrait');
        else setPrintOrientation('landscape');
      }, [view]);

      useEffect(() => {
        if (localStorage.getItem('tdmh_opd_version') !== VERSION_KEY) {
          localStorage.removeItem('tdmh_opd_departments');
          localStorage.removeItem('tdmh_opd_active_depts');
          localStorage.removeItem('tdmh_opd_intake_qs');
          localStorage.removeItem('tdmh_opd_responses'); 
          localStorage.removeItem('tdmh_opd_last_sync');
          localStorage.setItem('tdmh_opd_version', VERSION_KEY);
        }
      }, []);

      useEffect(() => {
        const rootElement = document.documentElement;
        if (isDark) {
          rootElement.classList.add('dark');
          localStorage.setItem('tdmh_opd_theme', 'dark');
        } else {
          rootElement.classList.remove('dark');
          localStorage.setItem('tdmh_opd_theme', 'light');
        }
      }, [isDark]);

      // Automatic Update Checker
      useEffect(() => {
        const checkForUpdates = async () => {
          try {
            const res = await fetch(window.location.href + '?t=' + new Date().getTime());
            const text = await res.text();
            const remoteVersionMatch = text.match(/const VERSION_KEY = "(tdmh_opd_v\d+)"/);
            if (remoteVersionMatch && remoteVersionMatch[1] !== VERSION_KEY) {
              setUpdateAvailable(true);
            }
          } catch (e) { console.log("Update check paused (likely offline)."); }
        };
        
        checkForUpdates(); // Check on load
        const updateInterval = setInterval(checkForUpdates, 60000 * 5); // Check every 5 minutes
        return () => clearInterval(updateInterval);
      }, []);

      useEffect(() => {
        if (drillDown || showSuccess || iframeUrl || confirmSync) {
          document.body.style.overflow = 'hidden';
          document.documentElement.style.overflow = 'hidden'; 
          document.body.style.touchAction = 'none';
          document.body.classList.add('modal-open');
        } else {
          document.body.style.overflow = '';
          document.documentElement.style.overflow = '';
          document.body.style.touchAction = '';
          document.body.classList.remove('modal-open');
        }
        return () => { 
           document.body.style.overflow = ''; 
           document.documentElement.style.overflow = ''; 
           document.body.style.touchAction = '';
           document.body.classList.remove('modal-open');
        };
      }, [drillDown, showSuccess, iframeUrl, confirmSync]);

      useEffect(() => {
        if (view === 'qr') {
          document.body.classList.add('printing-qr');
        } else {
          document.body.classList.remove('printing-qr');
        }
      }, [view]);

      const toggleTheme = () => {
        if (!document.startViewTransition) {
          setIsDark(!isDark);
          return;
        }
        document.startViewTransition(() => {
          setIsDark(prev => !prev);
        });
      };

      const [responses, setResponses] = useState(() => {
        const saved = localStorage.getItem('tdmh_opd_responses');
        try { return saved ? JSON.parse(saved) : []; } catch(e) { return []; }
      });

      const [censusData, setCensusData] = useState(() => {
        const saved = localStorage.getItem('tdmh_opd_census');
        try { return saved ? JSON.parse(saved) : {}; } catch(e) { return {}; }
      });

      const [intakeQuestions, setIntakeQuestions] = useState(() => {
        const version = localStorage.getItem('tdmh_opd_version');
        if (version !== VERSION_KEY) return DEFAULT_INTAKE_QUESTIONS;
        const saved = localStorage.getItem('tdmh_opd_intake_qs'); 
        try { return saved ? JSON.parse(saved) : DEFAULT_INTAKE_QUESTIONS; } catch(e) { return DEFAULT_INTAKE_QUESTIONS; }
      });

      const [departments, setDepartments] = useState(() => {
        const version = localStorage.getItem('tdmh_opd_version');
        if (version !== VERSION_KEY) return DEFAULT_DEPARTMENTS;
        const saved = localStorage.getItem('tdmh_opd_departments'); 
        try { return saved ? JSON.parse(saved) : DEFAULT_DEPARTMENTS; } catch(e) { return DEFAULT_DEPARTMENTS; }
      });

      const [legacy2025, setLegacy2025] = useState(null);
      const [legacy2026, setLegacy2026] = useState(null);

      const [activeDepartments, setActiveDepartments] = useState(() => {
        const defaultActive = DEFAULT_DEPARTMENTS.reduce((acc, dept) => ({ ...acc, [dept.id]: true }), {});
        const version = localStorage.getItem('tdmh_opd_version');
        if (version !== VERSION_KEY) return defaultActive;
        const saved = localStorage.getItem('tdmh_opd_active_depts'); 
        try { return saved ? JSON.parse(saved) : defaultActive; } catch(e) { return defaultActive; }
      });

      const [cqiReports, setCqiReports] = useState(() => {
         const saved = localStorage.getItem('tdmh_opd_cqi_reports');
         try { return saved ? JSON.parse(saved) : []; } catch(e) { return []; }
      });

      const flatDepartments = useMemo(() => getFlatDepartments(departments), [departments]);

      useEffect(() => localStorage.setItem('tdmh_opd_intake_qs', JSON.stringify(intakeQuestions)), [intakeQuestions]);
      useEffect(() => localStorage.setItem('tdmh_opd_departments', JSON.stringify(departments)), [departments]);
      useEffect(() => localStorage.setItem('tdmh_opd_active_depts', JSON.stringify(activeDepartments)), [activeDepartments]);

      useEffect(() => {
        if (!APPS_SCRIPT_URL) return;

        fetch(`${APPS_SCRIPT_URL}?action=get_legacy_2025`)
          .then(res => res.json())
          .then(data => setLegacy2025(data))
          .catch(err => console.log("Legacy 2025 fetch error:", err));

        fetch(`${APPS_SCRIPT_URL}?action=get_legacy_2026`)
          .then(res => res.json())
          .then(data => setLegacy2026(data))
          .catch(err => console.log("Legacy 2026 fetch error:", err));

        const fetchHistory = async () => {
          if (view === 'admin' || view === 'dept') setIsSyncing(true);
          try {
            const lastSync = localStorage.getItem('tdmh_opd_last_sync') || '';
            const fetchUrl = lastSync ? `${APPS_SCRIPT_URL}?lastSync=${encodeURIComponent(lastSync)}&includeCensus=true` : `${APPS_SCRIPT_URL}?includeCensus=true`;

            const res = await fetch(fetchUrl);
            if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);

            const newData = await res.json();

            if (newData.census) {
              const normalizedCensus = {};
              Object.keys(newData.census).forEach(k => {
                 let cleanKey = k.replace(/^'/, ''); 
                 if (!/^\d{4}-\d{2}$/.test(cleanKey)) {
                    const d = new Date(cleanKey);
                    if (!isNaN(d.getTime())) {
                       cleanKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                    }
                 }
                 normalizedCensus[cleanKey] = newData.census[k];
              });
              setCensusData(prev => {
                 const merged = { ...prev, ...normalizedCensus };
                 localStorage.setItem('tdmh_opd_census', JSON.stringify(merged));
                 return merged;
              });
            }

            if (newData.categories && Object.keys(newData.categories).length > 0) {
               setCommentCats(prev => {
                  const merged = { ...prev, ...newData.categories };
                  localStorage.setItem('tdmh_opd_comment_cats', JSON.stringify(merged));
                  return merged;
               });
            }

            if (newData.submittedReports && Array.isArray(newData.submittedReports)) {
               setCqiReports(newData.submittedReports);
               localStorage.setItem('tdmh_opd_cqi_reports', JSON.stringify(newData.submittedReports));
            }

            const resArray = newData.responses || (Array.isArray(newData) ? newData : []);
            if (Array.isArray(resArray) && resArray.length > 0) {
              setResponses(prev => {
                const combined = [...resArray, ...prev];
                const uniqueMap = new Map();

                combined.forEach(item => { 
                   if (item.id) uniqueMap.set(item.id, item); 
                   else uniqueMap.set(item.timestamp, item); 
                });
                const sortedUnique = Array.from(uniqueMap.values()).sort((a,b) => {
                    const dateA = new Date(a.timestamp);
                    const dateB = new Date(b.timestamp);
                    if (isNaN(dateA.getTime())) return 1;
                    if (isNaN(dateB.getTime())) return -1;
                    return dateB - dateA;
                });
                localStorage.setItem('tdmh_opd_responses', JSON.stringify(sortedUnique));
                return sortedUnique;
              });
            }
            localStorage.setItem('tdmh_opd_last_sync', new Date().toISOString());
          } catch (err) {
            console.warn("Sync paused (Offline or CORS). Running on local database.");
          } finally {
            setIsSyncing(false);
          }
        };

        fetchHistory();
        const intervalId = setInterval(() => { if (view === 'admin' || view === 'dept') fetchHistory(); }, 30000); 
        return () => clearInterval(intervalId); 
      }, [view]);

      const handleHardRefresh = () => {
         setConfirmSync(true);
      };

      const executeHardRefresh = () => {
         localStorage.removeItem('tdmh_opd_responses');
         localStorage.removeItem('tdmh_opd_cqi_reports');
         localStorage.removeItem('tdmh_opd_last_sync');
         window.location.reload();
      };

      const handleSurveySubmit = async (surveyData) => {
        if (isSubmittingRef.current || isSubmitting || showSuccess) return; 

        isSubmittingRef.current = true;
        setIsSubmitting(true);

        const liveNow = new Date();
        const optionsDate = { timeZone: 'Asia/Manila', year: 'numeric', month: '2-digit', day: '2-digit' };
        const optionsTime = { timeZone: 'Asia/Manila', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };

        const formatterDate = new Intl.DateTimeFormat('en-US', optionsDate);
        const formatterTime = new Intl.DateTimeFormat('en-US', optionsTime);

        const phDateString = formatterTime.format(liveNow);
        const phDateOnly = formatterDate.format(liveNow);

        const finalData = { 
            ...surveyData, 
            general: { ...surveyData.general, date: phDateOnly },
            timestamp: phDateString, 
            id: Date.now().toString() 
        };

        Object.keys(finalData.departments).forEach(id => {
          const matched = flatDepartments.find(d => d.id === id);
          if (matched) finalData.departments[id].title = matched.title;
        });

        setResponses(prev => {
          const newResponses = [finalData, ...prev];
          localStorage.setItem('tdmh_opd_responses', JSON.stringify(newResponses));
          return newResponses;
        });

        setIsSubmitting(false); 
        isSubmittingRef.current = false;
        setShowSuccess(true);
        window.scrollTo({ top: 0, behavior: 'smooth' });

        if (APPS_SCRIPT_URL) {
          try {
            fetch(APPS_SCRIPT_URL, { 
                method: 'POST', 
                mode: 'no-cors', 
                headers: { 'Content-Type': 'text/plain' }, 
                body: JSON.stringify(finalData) 
            }).catch(e => console.log("Background sync error:", e));
          } catch (error) { console.error("Error saving to Google Sheets:", error); }
        }
      };

      const handleCloseSuccess = () => {
        setShowSuccess(false);
        setSurveyKey(prev => prev + 1);
        setView('home');
        window.scrollTo({ top: 0, behavior: 'instant' });
      }

      const handleLogout = () => {
         setAuthUser(null);
         localStorage.removeItem('tdmh_opd_auth');
         setView('home');
      }

      return (
        <div className={`min-h-screen transition-colors duration-500 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 selection:bg-blue-200 dark:selection:bg-blue-800 relative pro-font flex flex-col`}>
          <style dangerouslySetInnerHTML={{__html: `
            @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');
            .pro-font { font-family: 'Lora', serif; }
            .hide-scrollbar::-webkit-scrollbar { display: none; }
            .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

            html, body { max-width: 100%; overflow-x: hidden; }
            #root { overflow-x: hidden; }

            .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
            .custom-scrollbar::-webkit-scrollbar-track { background: transparent; border-radius: 8px; }
            .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
            .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }

            ::view-transition-old(root),
            ::view-transition-new(root) {
              animation: none;
              mix-blend-mode: normal;
            }
            ::view-transition-old(root) { z-index: 1; }
            ::view-transition-new(root) { z-index: 2; }

            .dark::view-transition-new(root),
            :not(.dark)::view-transition-new(root) {
              animation: diagonal-wipe 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            }

            @keyframes diagonal-wipe {
              0% { clip-path: circle(0% at 100% 0%); }
              100% { clip-path: circle(150% at 100% 0%); }
            }

            /* --- FIXED PRINT LAYOUT --- */
            @media print {
              @page { size: ${printOrientation}; margin: 10mm; }
              html, body { 
                -webkit-print-color-adjust: exact !important; 
                print-color-adjust: exact !important; 
                margin: 0; padding: 0; width: 100% !important; height: auto !important;
                background: white !important; color: black !important;
                overflow: visible !important;
              }

              header, button, .fixed.bottom-3, .fixed.inset-0.z-0, .no-print { display: none !important; }

              body.modal-open .print-dashboard { display: none !important; }

              .custom-scrollbar, .overflow-x-auto, .overflow-y-auto, .overflow-hidden, .max-h-[600px], .max-h-[90vh], .print-modal-content, .report-table-wrapper {
                 overflow: visible !important;
                 max-height: none !important;
                 height: auto !important;
              }

              .print-dashboard, .print-modal-content {
                 position: static !important;
                 box-shadow: none !important;
                 border: none !important;
                 width: 100% !important;
                 max-width: none !important;
              }

              table { 
                 width: 100% !important; 
                 border-collapse: collapse !important; 
                 table-layout: fixed !important; 
                 margin-bottom: 20px !important; 
                 page-break-inside: auto !important;
                 font-size: 8px !important; 
              }

          {loginToast && (
             <div className="fixed top-24 left-1/2 transform -translate-x-1/2 z-[100] bg-green-600 text-white px-6 py-3 rounded-2xl shadow-2xl flex items-center gap-3 animate-in fade-in slide-in-from-top-4 duration-300 font-bold">

                      <button onClick={() => setConfirmSync(false)} className="flex-1 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-white font-bold py-3 px-4 rounded-xl transition-colors">Cancel</button>

          {iframeUrl && (
             <div className="fixed inset-0 z-[120] bg-slate-900/90 backdrop-blur-sm flex flex-col p-4 animate-in fade-in duration-300 no-print">
                <div className="flex justify-between items-center mb-4 bg-white/10 p-4 rounded-2xl backdrop-blur-md">

             <div className={`absolute inset-0 transition-opacity duration-700 ${isDark ? 'bg-slate-950/80 opacity-100' : 'bg-transparent opacity-0'}`} />
          </div>

          <button 
             onClick={toggleTheme} 
             className="fixed top-4 right-4 z-50 p-3 sm:p-4 rounded-full bg-white/90 dark:bg-slate-800/90 backdrop-blur-md shadow-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-yellow-400 hover:scale-110 active:scale-95 transition-all no-print"
             title="Toggle Night Mode"

          {view !== 'survey' && (
            <header className="bg-white/95 dark:bg-slate-900/95 backdrop-blur-md shadow-sm border-b-4 border-blue-600 dark:border-blue-500 sticky top-0 z-20 no-print transition-colors duration-300">
              <div className="max-w-6xl mx-auto px-4 py-3 sm:py-4 flex items-center justify-between relative min-h-[6rem] sm:min-h-[7rem]">
                <div className="flex-1 flex justify-start items-center gap-2">
                  {view === 'home' && (

                  )}

                  {(view === 'admin' || view === 'dept') && (
                    <>
                       <button onClick={handleHardRefresh} className="text-xs font-bold text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-blue-300 dark:hover:border-blue-700 px-3 py-1.5 rounded-lg flex items-center gap-2 shadow-sm transition-all" title="Force redownload from database">
                         <RefreshCw className="w-3 h-3"/> Re-Sync DB
                       </button>
                       {isSyncing && <span className="text-[10px] font-bold text-slate-400 animate-pulse ml-2">Syncing...</span>}
                    </>
                  )}
                </div>
                <div className="flex-1 flex justify-center cursor-pointer group" title="Reload System" onClick={() => window.location.reload()}>
                  <div className="bg-white/80 dark:bg-white px-4 sm:px-6 py-2 rounded-2xl shadow-sm transition-colors duration-300 flex items-center justify-center">
                    <img src={LOGO_URL} alt="Taytay Doctors Logo" className="h-16 sm:h-20 md:h-24 lg:h-28 w-auto object-contain transition-all duration-300 group-hover:scale-110 drop-shadow-sm" />
                  </div>
                </div>
                <div className="flex-1 flex justify-end items-center gap-2 sm:gap-4 pr-16 sm:pr-20"> 
                  {view === 'home' && (
                      authUser ? (
                         <button onClick={() => { if (authUser.role === 'admin') setView('admin'); else { setActiveDeptId(authUser.id); setView('dept'); } }} className="text-sm font-bold text-slate-500 dark:text-slate-400 hover:text-blue-700 dark:hover:text-blue-400 flex items-center gap-2 px-3 py-2 rounded-xl transition-all hover:bg-blue-50 dark:hover:bg-slate-800 shadow-sm bg-white dark:bg-slate-800 border border-transparent dark:border-slate-700">
                            <Lock className="w-4 h-4" /> <span className="hidden lg:inline">{`Dashboard (${authUser.name})`}</span>
                         </button>
                      ) : (
                         <>
                            <button onClick={() => { setLoginMode('admin'); setView('login'); }} className="text-sm font-bold text-red-700 dark:text-red-400 hover:text-white dark:hover:text-white flex items-center justify-center w-10 h-10 sm:w-auto sm:h-auto sm:px-4 sm:py-2.5 rounded-full sm:rounded-xl transition-all hover:bg-red-600 dark:hover:bg-red-600 shadow-sm bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800/50" title="Admin Login">
                               <ShieldAlert className="w-5 h-5" /> <span className="hidden sm:inline ml-2">Admin</span>
                            </button>
                            <button onClick={() => { setLoginMode('dept'); setView('login'); }} className="text-sm font-bold text-blue-800 dark:text-blue-300 hover:text-white dark:hover:text-white flex items-center justify-center w-10 h-10 sm:w-auto sm:h-auto sm:px-4 sm:py-2.5 rounded-full sm:rounded-xl transition-all hover:bg-blue-600 dark:hover:bg-blue-600 shadow-sm bg-blue-50 dark:bg-blue-900/40 border border-blue-200 dark:border-blue-800/50" title="Dept Login">
                               <Users className="w-5 h-5" /> <span className="hidden sm:inline ml-2">Departments</span>
                            </button>
                         </>
                      )
                  )}
                  {view !== 'home' && (
                    <div className="flex items-center gap-2">
                       <button onClick={() => setView('home')} className="text-sm font-bold text-blue-800 dark:text-blue-200 hover:text-white dark:hover:text-white hover:bg-blue-600 dark:hover:bg-blue-600 flex items-center gap-2 bg-blue-100 dark:bg-blue-900/50 px-4 py-2.5 rounded-xl transition-all shadow-sm">
                         <ArrowLeft className="w-5 h-5" /> <span className="hidden sm:inline">HOME</span>
                       </button>
                       {authUser && (view === 'admin' || view === 'dept') && (
                         <button onClick={handleLogout} className="text-sm font-bold text-slate-500 dark:text-slate-400 hover:text-red-600 dark:hover:text-red-400 flex items-center gap-2 bg-white dark:bg-slate-800 px-4 py-2.5 rounded-xl transition-all shadow-sm border border-slate-200 dark:border-slate-700 hover:border-red-200 dark:hover:border-red-900" title="Log Out">
                           <LogOut className="w-4 h-4" />
                         </button>
                       )}
                    </div>
                  )}
                </div>
              </div>
            </header>
          )}

          <main className={`max-w-5xl mx-auto w-full relative z-10 flex-grow transition-all duration-300 p-4 sm:p-6 lg:p-8`}>
            {view === 'home' && (
               <div className="flex flex-col w-full">
                  <HomeBanner onStartClick={() => {
                     document.getElementById('survey-section')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
                  }} />
                  <div id="survey-section" className="scroll-mt-28">
                     <PatientSurvey key={surveyKey} onSubmit={handleSurveySubmit} intakeQuestions={intakeQuestions} activeDepartments={activeDepartments} departments={departments} isSubmitting={isSubmitting} setView={setView} />
                  </div>
               </div>
            )}
            {view === 'login' && <LoginSelectView loginMode={loginMode} setView={setView} setActiveDeptId={setActiveDeptId} departments={departments} flatDepartments={flatDepartments} setAuthUser={setAuthUser} setLoginToast={setLoginToast} />}
            {view === 'admin' && <AdminDashboard responses={responses} censusData={censusData} setCensusData={setCensusData} activeDepartments={activeDepartments} setActiveDepartments={setActiveDepartments} departments={departments} setDepartments={setDepartments} flatDepartments={flatDepartments} drillDown={drillDown} setDrillDown={setDrillDown} commentCats={commentCats} setCommentCats={setCommentCats} intakeQuestions={intakeQuestions} setIntakeQuestions={setIntakeQuestions} handleHardRefresh={handleHardRefresh} cqiReports={cqiReports} setCqiReports={setCqiReports} legacy2025={legacy2025} legacy2026={legacy2026} setIframeUrl={setIframeUrl} />}

            {view === 'dept' && <DepartmentDashboard responses={responses} deptId={activeDeptId} departments={departments} flatDepartments={flatDepartments} drillDown={drillDown} setDrillDown={setDrillDown} commentCats={commentCats} setCommentCats={setCommentCats} cqiReports={cqiReports} setCqiReports={setCqiReports} legacy2025={legacy2025} legacy2026={legacy2026} setIframeUrl={setIframeUrl} />}

            {view === 'qr' && <QRGenerator />}
          </main>

          <div className="fixed bottom-3 left-4 z-20 text-xs sm:text-sm font-bold text-slate-500/80 dark:text-slate-400/50 pointer-events-none tracking-widest no-print">
            {FORM_CONTROL_NO}
          </div>

          {drillDown && <DrillDownModal drillDown={drillDown} setDrillDown={setDrillDown} />}
          {showSuccess && <SuccessModal onClose={handleCloseSuccess} />}
        </div>
      );
    }
function AdminDashboard({ responses, censusData, setCensusData, activeDepartments, setActiveDepartments, departments, setDepartments, flatDepartments, drillDown, setDrillDown, commentCats, setCommentCats, intakeQuestions, setIntakeQuestions, handleHardRefresh, cqiReports, setCqiReports, legacy2025, legacy2026, setIframeUrl }) {
      const [activeTab, setActiveTab] = useState('overview'); 
      const [newDeptName, setNewDeptName] = useState('');
      const [newQuestions, setNewQuestions] = useState({});
      const [newIntakeQ, setNewIntakeQ] = useState('');
      const [statusUpdateReport, setStatusUpdateReport] = useState(null);

      const [newServices, setNewServices] = useState({});
      const [isSavingCensus, setIsSavingCensus] = useState(false);

      const [volumeViewMode, setVolumeViewMode] = useState('rate'); 

      const liveDate = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      const currentMonthKey = getMonthString(new Date());

      const [overviewMonth, setOverviewMonth] = useState(currentMonthKey);

      const [draftCensus, setDraftCensus] = useState(censusData[overviewMonth] || '');
      const prevOverviewMonth = useRef(overviewMonth);

      useEffect(() => {
          if (prevOverviewMonth.current !== overviewMonth) {
              setDraftCensus(censusData[overviewMonth] || '');
              prevOverviewMonth.current = overviewMonth;
          } else {
              setDraftCensus(prev => prev === '' || prev == 0 ? (censusData[overviewMonth] || '') : prev);
          }
      }, [censusData, overviewMonth]);

      const handleCensusSave = async () => {
         setIsSavingCensus(true);
         const newData = { ...censusData, [overviewMonth]: draftCensus };
         setCensusData(newData);

         try {
           await fetch(APPS_SCRIPT_URL, {
             method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
             body: JSON.stringify({ action: "update_census", monthKey: `'${overviewMonth}`, censusValue: draftCensus })
           });
           localStorage.setItem('tdmh_opd_census', JSON.stringify(newData));
         } catch(e) { console.error("Error saving census:", e); }

         setTimeout(() => { setIsSavingCensus(false); }, 1500);
      }

      const [selectedCommentMonth, setSelectedCommentMonth] = useState('all');
      const [selectedArchiveMonth, setSelectedArchiveMonth] = useState('all');
      const [selectedArchiveDept, setSelectedArchiveDept] = useState('all');

      const analytics = useMemo(() => {
        const currentYear = new Date().getFullYear();
        const allMonthsKeys = Array.from({length: 12}, (_, i) => `${currentYear}-${String(i + 1).padStart(2, '0')}`);

        let totalScore = 0; let totalQuestionsAnswered = 0;
        const deptStats = {};
        const monthlySatData = {};
        const sentimentMonthly = {};

        flatDepartments.forEach(d => deptStats[d.id] = { monthly: {} });
        allMonthsKeys.forEach(mk => {
           flatDepartments.forEach(d => deptStats[d.id].monthly[mk] = { score: 0, count: 0 });
           monthlySatData[mk] = { score: 0, max: 0 };
           sentimentMonthly[mk] = { happy: 0, neutral: 0, sad: 0, total: 0 };
        });

        const monthlyResponsesTally = {};
        allMonthsKeys.forEach(mk => monthlyResponsesTally[mk] = 0);

        const genTallies = {};
        GENERAL_QUESTIONS.forEach(q => {
          genTallies[q.id] = { id: q.id, text: q.text, type: q.type, overall: { Yes: 0, No: 0 }, monthly: {} };
        });

        let responsesThisMonthCount = 0;
        const allCommentsArray = [];

        const todaysResponses = responses.filter(r => {
           if(!r || !r.timestamp) return false;
           return getMonthString(new Date(r.timestamp)) === overviewMonth;
        }).sort((a, b) => {
            const dateA = new Date(a.timestamp);
            const dateB = new Date(b.timestamp);
            if (isNaN(dateA.getTime())) return 1;
            if (isNaN(dateB.getTime())) return -1;
            return dateB - dateA;
        });

        responses.forEach(res => {
          if (!res || !res.timestamp) return;
          const resMonth = getMonthString(new Date(res.timestamp));
          if (resMonth === currentMonthKey) responsesThisMonthCount++; 

          if (monthlyResponsesTally[resMonth] !== undefined) {
             monthlyResponsesTally[resMonth]++;
          }

          if (res.general) {
            GENERAL_QUESTIONS.forEach(q => {
              const ans = res.general[q.id];
              if (!ans) return;
              if (!genTallies[q.id].monthly[resMonth]) genTallies[q.id].monthly[resMonth] = { Yes: 0, No: 0, responses: [], isText: q.type !== 'yesno' && q.type !== 'compare' };

              if (q.type === 'yesno' || q.type === 'compare') {
                if (q.type === 'yesno') {
                   genTallies[q.id].overall[ans]++;
                   genTallies[q.id].monthly[resMonth][ans]++;
                }
                genTallies[q.id].monthly[resMonth].responses.push({ date: res.timestamp, value: ans, isText: false, name: res.general?.patient_name, room: res.general?.queue_number || res.general?.room_number });
              } else {
                 genTallies[q.id].monthly[resMonth].responses.push({ date: res.timestamp, value: ans, isText: true, name: res.general?.patient_name, room: res.general?.queue_number || res.general?.room_number });
              }
            });
          }

          let hasAnswered = false;
          let lowestSurveyScore = 3;

          if (res.departments) {
            Object.entries(res.departments).forEach(([deptId, data]) => {
              if (!data.skipped && data.answers) {
                let resScore = 0; let resCount = 0;
                Object.values(data.answers).forEach(score => {
                   const numScore = Number(score) || 0; 
                   if (numScore > 0) {
                       hasAnswered = true;
                       if (numScore < lowestSurveyScore) lowestSurveyScore = numScore;
                   }
                   resScore += numScore; resCount += 1;
                   totalScore += numScore; totalQuestionsAnswered += 1;

                   if (deptStats[deptId] && deptStats[deptId].monthly[resMonth]) {
                     deptStats[deptId].monthly[resMonth].score += numScore;
                     deptStats[deptId].monthly[resMonth].count += 1;
                   }
                });

                if (monthlySatData[resMonth] && resCount > 0) {
                   monthlySatData[resMonth].score += resScore;
                   monthlySatData[resMonth].max += (resCount * 3);
                }

                const avgResScore = resCount > 0 ? (resScore/resCount) : 0;
                if (data.comment && data.comment.trim() !== '') {
                  const fallbackTime = new Date(res.timestamp).getTime();
                  const uniqueId = `${res.id || fallbackTime}_${deptId}`;
                  const matchedDeptTitle = flatDepartments.find(d => d.id === deptId)?.title || deptId;

                  allCommentsArray.push({ 
                     id: uniqueId, 
                     text: data.comment, 
                     date: res.timestamp, 
                     score: avgResScore, 
                     room: res.general?.queue_number || res.general?.room_number || 'Unknown',
                     deptName: matchedDeptTitle
                  });
                }
              }
            });
          }

          if (hasAnswered && sentimentMonthly[resMonth]) {
              sentimentMonthly[resMonth].total++;
              if (lowestSurveyScore === 3) sentimentMonthly[resMonth].happy++;
              else if (lowestSurveyScore === 2) sentimentMonthly[resMonth].neutral++;
              else if (lowestSurveyScore === 1) sentimentMonthly[resMonth].sad++;
          }
        });

        allCommentsArray.sort((a,b) => new Date(b.date) - new Date(a.date));

        const fullYearDeptData = flatDepartments.map(d => {
           const monthlyAverages = allMonthsKeys.map(mk => {
              const mStats = deptStats[d.id].monthly[mk];
              const maxPossible = mStats.count * 3;
              const satPct = maxPossible > 0 ? Math.min(Math.round((mStats.score / maxPossible) * 100), 100) : '-';
              return satPct;
           });
           return { id: d.id, title: d.title, monthlyAverages, isSub: d.type === 'sub' };
        });

        const recRate = (genTallies['gen_5'].overall.Yes + genTallies['gen_5'].overall.No) > 0 
          ? Math.round((genTallies['gen_5'].overall.Yes / (genTallies['gen_5'].overall.Yes + genTallies['gen_5'].overall.No)) * 100) : 0;

        const maxResponsesMonthly = Math.max(...Object.values(monthlyResponsesTally), 1); 

        const mSat = monthlySatData[overviewMonth];
        const overviewSatPct = mSat && mSat.max > 0 ? Math.min(Math.round((mSat.score / mSat.max) * 100), 100) : 0;

        return { 
          responsesThisMonthCount, allMonthsKeys, overviewSatPct, 
          recommendationRate: recRate, fullYearDeptData, genTallies, monthlyResponsesTally, maxResponsesMonthly,
          todaysResponses, allCommentsArray, sentimentMonthly
        };
      }, [responses, flatDepartments, currentMonthKey, overviewMonth]);

      const handleAddDepartment = (e) => {
        e.preventDefault(); if(!newDeptName.trim()) return;
        const newId = 'dept_' + Date.now();
        setDepartments([...departments, { id: newId, title: newDeptName.trim(), type: 'standard', questions: [] }]);
        setActiveDepartments({...activeDepartments, [newId]: true}); setNewDeptName('');
      };

      const handleAddQuestion = (deptId) => {
        const qText = newQuestions[deptId]; if(!qText || !qText.trim()) return;
        setDepartments(departments.map(d => d.id === deptId ? {...d, questions: [...d.questions, {id: 'q_'+Date.now(), text: qText.trim()}]} : d ));
        setNewQuestions({...newQuestions, [deptId]: ''});
      };

      const handleAddService = (deptId) => {
        const sText = newServices[deptId];
        if(!sText || !sText.trim()) return;
        setDepartments(departments.map(d => 
          d.id === deptId ? {...d, services: [...(d.services || []), sText.trim()]} : d
        ));
        setNewServices({...newServices, [deptId]: ''});
      };

      const handleAddIntakeQuestion = (e) => {
        e.preventDefault();
        if(!newIntakeQ.trim()) return;
        setIntakeQuestions([...intakeQuestions, { id: 'intake_' + Date.now(), text: newIntakeQ.trim(), type: 'short_text', required: false }]);
        setNewIntakeQ('');
      };

      const handleEditIntakeQuestion = (id, newText) => setIntakeQuestions(intakeQuestions.map(q => q.id === id ? { ...q, text: newText } : q));
      const handleDeleteIntakeQuestion = (id) => setIntakeQuestions(intakeQuestions.filter(q => q.id !== id));

      const handleEditQuestion = (deptId, qId, newText) => setDepartments(departments.map(d => d.id === deptId ? { ...d, questions: d.questions.map(q => q.id === qId ? { ...q, text: newText } : q) } : d));
      const handleDeleteQuestion = (deptId, qId) => setDepartments(departments.map(d => d.id === deptId ? { ...d, questions: d.questions.filter(q => q.id !== qId) } : d));

      const handleEditService = (deptId, idx, newText) => setDepartments(departments.map(d => {
         if (d.id === deptId) {
            const updated = [...d.services];
            updated[idx] = newText;
            return { ...d, services: updated };
         }
         return d;
      }));
      const handleDeleteService = (deptId, idx) => setDepartments(departments.map(d => d.id === deptId ? { ...d, services: d.services.filter((_, i) => i !== idx) } : d));

      const currentCensus = parseInt(censusData[overviewMonth]) || 0;
      const currentOverviewCount = analytics.monthlyResponsesTally[overviewMonth] || 0;
      const currentResponseRate = currentCensus > 0 ? ((currentOverviewCount / currentCensus) * 100).toFixed(1) : 0;

      const filteredCqiReports = cqiReports.filter(r => {
         let match = true;
         if (selectedArchiveMonth !== 'all' && r.Report_Month !== selectedArchiveMonth) match = false;
         if (selectedArchiveDept !== 'all' && r.Department !== selectedArchiveDept) match = false;

                      <p className="text-slate-600 dark:text-slate-300 font-bold mb-1 uppercase tracking-wide text-sm">Total Census</p>

                      </div>
                    </div>
                  </div>

                      <p className="text-blue-800 dark:text-blue-300 font-bold mb-1 uppercase tracking-wide text-sm">Total Responses</p>
                      <p className="text-[10px] text-blue-600 dark:text-blue-400 mb-4 leading-tight uppercase font-bold tracking-widest bg-blue-100 dark:bg-blue-900/60 inline-block px-2 py-1 rounded">({overviewMonth})</p>
                      <p className="text-3xl sm:text-4xl lg:text-5xl font-black text-blue-900 dark:text-blue-100 truncate">{currentOverviewCount}</p>
                    </div>
                    <p className="text-[10px] font-bold text-blue-600 dark:text-blue-400 mt-6 uppercase tracking-widest">Automated Count</p>
                  </div>
                  <div className="bg-emerald-50 dark:bg-emerald-900/30 border border-emerald-200 dark:border-emerald-800/50 rounded-3xl p-6 shadow-sm flex flex-col justify-between relative group">

                       <p className="text-emerald-800 dark:text-emerald-300 font-bold mb-1 uppercase tracking-wide text-sm">Response Rate</p>

                       <p className="text-3xl sm:text-4xl lg:text-5xl font-black text-emerald-900 dark:text-emerald-100 truncate">{currentResponseRate}%</p>

                        const heightPctVolume = mCensus > 0 ? Math.min(rate, 100) : (analytics.maxResponsesMonthly > 0 ? (count / analytics.maxResponsesMonthly) * 100 : 0);

                        const sentData = analytics.sentimentMonthly[mk];
                        const maxSent = Math.max(...Object.values(analytics.sentimentMonthly).map(s => s.total), 1);
                        const happyHeight = sentData.total > 0 ? (sentData.happy / maxSent) * 100 : 0;
                        const neutralHeight = sentData.total > 0 ? (sentData.neutral / maxSent) * 100 : 0;
                        const sadHeight = sentData.total > 0 ? (sentData.sad / maxSent) * 100 : 0;
                        const totalHeightSentiment = happyHeight + neutralHeight + sadHeight;

                        return (

                                                 <span className="text-yellow-500 dark:text-yellow-400">{sentData.neutral}</span>
                                                 <span className="text-red-500 dark:text-red-400">{sentData.sad}</span>
                                              </>
                                           )}
                                        </div>
                                     </>

                              ) : (
                                  <div className="w-full max-w-[4rem] flex flex-col justify-end gap-[1px] transition-all duration-700" style={{ height: `${totalHeightSentiment}%`, minHeight: sentData.total > 0 ? '5%' : '4px' }}>
                                     {sentData.happy > 0 && <div className="w-full bg-green-500 dark:bg-green-600 rounded-t-sm" style={{ height: `${(sentData.happy / sentData.total) * 100}%`, minHeight: '2px' }}></div>}
                                     {sentData.neutral > 0 && <div className="w-full bg-yellow-400 dark:bg-yellow-500" style={{ height: `${(sentData.neutral / sentData.total) * 100}%`, minHeight: '2px' }}></div>}

                     {volumeViewMode === 'rate' ? (
                        <>
                           <span className="flex items-center gap-3"><div className="w-4 h-4 bg-blue-400 rounded-full shadow-inner"></div> Other Months</span>
                           <span className="flex items-center gap-3"><div className="w-4 h-4 bg-indigo-500 rounded-full shadow-inner"></div> Filtered Month</span>
                           <span className="flex items-center gap-3"><div className="px-2 py-0.5 bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 rounded text-xs">XX%</div> Response Rate</span>

                     ) : (
                        <>
                           <span className="flex items-center gap-2"><div className="w-3 h-3 bg-green-500 rounded-sm"></div> Happy</span>
                           <span className="flex items-center gap-2"><div className="w-3 h-3 bg-yellow-400 rounded-sm"></div> Neutral</span>
                           <span className="flex items-center gap-2"><div className="w-3 h-3 bg-red-500 rounded-sm"></div> Sad</span>

                     )}

                       const total = tally.overall.Yes + tally.overall.No;
                       const pctYes = total > 0 ? Math.round((tally.overall.Yes / total) * 100) : 0;

                       return (
                         <div key={q.id} onClick={() => setDrillDown({ type: 'general_question', data: tally, questionText: q.text })} className="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm hover:border-blue-400 dark:hover:border-blue-500 hover:shadow-md cursor-pointer transition-all group flex flex-col justify-between">

                                 <path className={`${pctYes >= 50 ? 'text-blue-500' : 'text-amber-500'} transition-all duration-1000 ease-out`} strokeDasharray={`${pctYes}, 100`} d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="round"/>

                           </div>

                   </div>
                </div>
              </div>
            )}
{activeTab === 'monitoring' && (
               <div className="space-y-6 animate-in slide-in-from-bottom-2">
                  <div className="flex justify-between items-center mb-6">
                     <div>
                        <h3 className="text-2xl sm:text-3xl font-black font-serif flex items-center gap-3 text-slate-800 dark:text-white"><UserCheck className="text-blue-600 dark:text-blue-400 w-8 h-8" /> Live Patient Monitoring</h3>

                  <div className="bg-white dark:bg-slate-800 rounded-[2rem] border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">

                     ) : (
                        <div className="overflow-x-auto custom-scrollbar report-table-wrapper">
                           <table className="w-full text-left table-fixed">
                              <thead className="bg-slate-50 dark:bg-slate-900 text-slate-500 dark:text-slate-400 font-black uppercase tracking-wider text-xs border-b border-slate-200 dark:border-slate-700">
                                 <tr>
                                    <th className="p-5 w-[20%]">Date & Time Submitted</th>
                                    <th className="p-5 w-[30%]">Patient Name</th>

                              </thead>

                                 {analytics.todaysResponses.map(r => (
                                    <tr key={r.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                                       <td className="p-5 text-sm font-medium">
                                          {isNaN(new Date(r.timestamp).getTime()) ? r.timestamp : (
                                              <>
                                                {new Date(r.timestamp).toLocaleDateString('en-US', {month: 'short', day: 'numeric'})} <br className="hidden sm:block"/>at {new Date(r.timestamp).toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'})}
                                              </>
                                          )}

                                       <td className="p-5 font-medium bg-slate-50 dark:bg-slate-900/50 truncate">{r.general?.queue_number || r.general?.room_number || 'N/A'}</td>
                                       <td className="p-3 text-right">
                                           <div className="flex items-center justify-end gap-2 flex-wrap">
                                              <span className="bg-green-100 dark:bg-green-900/40 text-green-700 dark:text-green-400 border border-green-200 dark:border-green-800/50 px-2 py-1 rounded-lg text-[10px] font-black uppercase tracking-widest inline-flex items-center gap-1">

                                              </span>
                                              <button 
                                                 onClick={() => setDrillDown({ type: 'daily_comments', patientData: r, allComments: analytics.allCommentsArray })}

                                              >
                                                 <MessageSquare className="w-3 h-3"/> View Comments
                                              </button>
                                           </div>
                                       </td>
                                    </tr>
                                 ))}
                              </tbody>
                           </table>
