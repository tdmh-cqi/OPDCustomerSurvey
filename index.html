function MasterFeedbackManager({ comments, commentCats, setCommentCats, selectedMonth, onMonthChange, monthsList, flatDepartments, cqiReports, isDeptView = false }) {
       const [subTab, setSubTab] = useState('all');

       const handleSetCat = (id, category) => {
          setCommentCats(prev => {
             const updated = { ...prev };
             if (category === 'uncategorized') delete updated[id];
             else updated[id] = category;

             fetch(APPS_SCRIPT_URL, {
                method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({ action: "update_comment_cats", categories: updated })
             }).catch(e => console.log(e));

             return updated;
          });
       };

       const filteredComments = comments.filter(c => {
          if (selectedMonth !== 'all') {
             const cMonth = getMonthString(new Date(c.date));
             return cMonth === selectedMonth;
          }
          return true;
       });

       const inboxList = filteredComments.filter(c => !commentCats[c.id]);
       const posList = filteredComments.filter(c => commentCats[c.id] === 'positive');
       const mixList = filteredComments.filter(c => commentCats[c.id] === 'mixed');
       const negList = filteredComments.filter(c => commentCats[c.id] === 'negative');

       let currentList = filteredComments;
       if (subTab === 'inbox') currentList = inboxList;
       else if (subTab === 'positive') currentList = posList;
       else if (subTab === 'mixed') currentList = mixList;
       else if (subTab === 'negative') currentList = negList;

       return (
         <div className="space-y-6 sm:space-y-8 animate-in slide-in-from-bottom-2">

            <div className="bg-white dark:bg-slate-800 rounded-3xl p-3 sm:p-4 shadow-sm border border-slate-200 dark:border-slate-700 transition-colors no-print">
               <div className="flex flex-wrap gap-2 sm:gap-4">
                  {['all', 'inbox', 'positive', 'mixed', 'negative'].map(tab => {
                     let count = 0;
                     if (tab === 'all') count = filteredComments.length;
                     if (tab === 'inbox') count = inboxList.length;
                     if (tab === 'positive') count = posList.length;
                     if (tab === 'mixed') count = mixList.length;
                     if (tab === 'negative') count = negList.length;

                     return (
                        <button key={tab} onClick={() => setSubTab(tab)} className={`flex-1 min-w-[110px] py-3 px-4 rounded-xl font-black text-xs sm:text-sm uppercase tracking-wider transition-all flex items-center justify-center gap-2 border-2 ${subTab === tab ? 'bg-blue-600 border-blue-600 text-white shadow-md' : 'bg-slate-50 dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:border-blue-300 dark:hover:border-blue-600'}`}>
                           {tab === 'all' ? <FileText className="w-4 h-4 hidden sm:block"/> : tab === 'inbox' ? <Inbox className="w-4 h-4 hidden sm:block"/> : tab === 'positive' ? <ThumbsUp className="w-4 h-4 hidden sm:block"/> : tab === 'mixed' ? <Scale className="w-4 h-4 hidden sm:block"/> : <AlertTriangle className="w-4 h-4 hidden sm:block"/>}
                           {tab} <span className={`px-2 py-0.5 rounded-full text-[10px] ${subTab === tab ? 'bg-blue-500/50 text-white' : 'bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}`}>{count}</span>
                        </button>
                     )
                  })}
               </div>
            </div>

            <div className="bg-slate-100/50 dark:bg-slate-900/50 p-4 sm:p-6 rounded-[2rem] border border-slate-200 dark:border-slate-700 min-h-[400px]">

               <div className="flex flex-col sm:flex-row gap-4 mb-6 no-print">
                  <div className="flex-1">
                     <label className="block text-slate-600 dark:text-slate-400 font-black text-xs mb-2 uppercase tracking-widest">Filter by Month</label>
                     <select className="w-full p-4 rounded-xl border-2 border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-900 font-bold text-slate-700 dark:text-white outline-none focus:border-blue-500 transition-colors shadow-sm cursor-pointer" value={selectedMonth} onChange={e => onMonthChange(e.target.value)}>
                        <option value="all">All Time</option>
                        {monthsList.map((mk) => <option key={mk} value={mk}>{ALL_MONTHS_LABELS[parseInt(mk.split('-')[1])-1]} {mk.split('-')[0]}</option>)}
                     </select>
                  </div>
               </div>

               {subTab === 'all' && !isDeptView ? (
                  <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden flex flex-col print:border-0 print:shadow-none print:rounded-none">
                     <div className="p-6 bg-slate-50 dark:bg-slate-900/50 border-b border-slate-200 dark:border-slate-700 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                           <h3 className="font-black text-2xl text-slate-800 dark:text-white font-serif uppercase tracking-widest">ALL COMMENTS</h3>
                           <p className="text-blue-600 dark:text-blue-400 font-bold text-sm tracking-widest uppercase mt-1">SURVEY RESULTS • {selectedMonth === 'all' ? 'All Time' : selectedMonth}</p>
                        </div>
                        <button onClick={() => window.print()} className="bg-slate-800 dark:bg-slate-700 text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 hover:bg-slate-700 dark:hover:bg-slate-600 transition-colors shadow-sm no-print"><Printer className="w-4 h-4" /> Print List</button>
                     </div>
                     <div className="overflow-x-auto custom-scrollbar report-table-wrapper">
                        <table className="w-full text-left table-fixed text-[10px] sm:text-xs print:text-[8px] break-words whitespace-normal">
                           <thead className="bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-black uppercase tracking-wider border-b-2 border-slate-200 dark:border-slate-700 print:bg-transparent print:text-black">
                              <tr>
                                 <th className="p-3 print:p-1 align-top w-[14%] border-r border-slate-100 dark:border-slate-700 whitespace-nowrap">Date</th>
                                 <th className="p-3 print:p-1 align-top w-[25%] border-r border-slate-100 dark:border-slate-700">Department</th>
                                 <th className="p-3 print:p-1 align-top w-[47%]">Comments / Suggestions</th>
                                 <th className="p-3 print:p-1 align-top w-[14%] text-center border-l border-slate-100 dark:border-slate-700 whitespace-nowrap">Status</th>
                              </tr>
                           </thead>
                           <tbody className="divide-y divide-slate-100 dark:divide-slate-700/50 text-slate-800 dark:text-slate-200 font-medium print:text-black">
                              {currentList.map(c => {
                                 let displayStatus = "";
                                 let statusColor = "";
                                 const cat = commentCats[c.id];

                                 if (cat === 'positive' || cat === 'mixed') {
                                    displayStatus = "NOTED";
                                    statusColor = "text-slate-500 dark:text-slate-400";
                                 } else if (cat === 'negative') {
                                    const reportedStatus = cqiReports.find(r => r.Case_No && r.Department === c.deptName && r.Report_Month === selectedMonth && r.Complaint === c.text)?.Status;

                                    if (reportedStatus === 'Closed') {
                                       displayStatus = "CLOSED";
                                       statusColor = "text-green-600 dark:text-green-400 bg-green-50 dark:bg-green-900/30 px-2 py-1 rounded-md";
                                    } else if (reportedStatus === 'For Monitoring' || reportedStatus === 'For Continuous Monitoring') {
                                       displayStatus = "MONITORING";
                                       statusColor = "text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 px-2 py-1 rounded-md";
                                    } else {
                                       displayStatus = "PENDING";
                                       statusColor = "text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-900/30 px-2 py-1 rounded-md font-black";
                                    }
                                 }

                                 return (
                                    <tr key={c.id} className="hover:bg-slate-50 dark:hover:bg-slate-700/30 transition-colors break-inside-avoid">
                                       <td className="p-3 print:p-1 align-top border-r border-slate-100 dark:border-slate-700 text-xs print:text-[8px]">
                                          {isNaN(new Date(c.date).getTime()) ? c.date : new Date(c.date).toLocaleDateString('en-US')}
                                       </td>
                                       <td className="p-3 print:p-1 align-top border-r border-slate-100 dark:border-slate-700 font-bold uppercase text-[10px] sm:text-xs print:text-[8px] tracking-wider text-slate-500 dark:text-slate-400">
                                          {c.deptName}
                                       </td>
                                       <td className="p-3 print:p-1 align-top italic leading-relaxed text-slate-700 dark:text-slate-300 break-words">
                                          "{c.text}"
                                       </td>
                                       <td className="p-3 print:p-1 align-top text-center border-l border-slate-100 dark:border-slate-700">
                                          {displayStatus && <span className={`text-[9px] print:text-[7px] font-black uppercase tracking-widest ${statusColor}`}>{displayStatus}</span>}
                                       </td>
                                    </tr>
                                 )
                              })}
                           </tbody>
                        </table>
                     </div>
                  </div>
               ) : currentList.length === 0 ? (
                  <div className="flex flex-col items-center justify-center h-full text-slate-400 dark:text-slate-600 min-h-[300px]">
                     <MessageSquare className="w-12 h-12 mb-4 opacity-30"/>
                     <p className="font-bold text-lg">No comments found in this category.</p>
                  </div>
               ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
                     {currentList.map(c => (
                        <div key={c.id} className="bg-white dark:bg-slate-800 p-5 sm:p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col justify-between break-inside-avoid print:mb-4">
                           <div>
                              <div className="bg-blue-50 dark:bg-slate-700 text-blue-800 dark:text-slate-300 px-3 py-1 rounded-lg font-black text-xs mb-4 inline-block uppercase tracking-wider border border-blue-100 dark:border-slate-600 shadow-sm">{c.deptName}</div>
                              <p className="text-slate-800 dark:text-white font-medium text-lg leading-relaxed mb-4">"{c.text}"</p>
                              <div className="flex flex-col sm:flex-row sm:flex-wrap items-start sm:items-center gap-3 text-sm mb-6 border-t border-slate-100 dark:border-slate-700 pt-4">
                                 <span className="text-slate-500 dark:text-slate-400 font-bold uppercase tracking-wider">
                                    {isNaN(new Date(c.date).getTime()) ? c.date : new Date(c.date).toLocaleDateString('en-US')}
                                 </span>
                                 <span className="font-bold text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 px-2 py-0.5 rounded border border-slate-200 dark:border-slate-600">Queue/Ticket: {c.room}</span>
                                 {c.score > 0 && <span className="font-bold text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-700 px-2 py-0.5 rounded border border-slate-200 dark:border-slate-600">Score: {c.score.toFixed(1)}</span>}
                              </div>
                           </div>

                           {!isDeptView && (
                              <div className="bg-slate-50 dark:bg-slate-900 p-3 sm:p-4 rounded-xl border border-slate-200 dark:border-slate-700 no-print">
                                 <p className="text-xs font-bold text-slate-400 dark:text-slate-500 mb-3 uppercase tracking-widest text-center">Categorize As:</p>
                                 <div className="flex flex-col sm:flex-row flex-wrap gap-2">
                                    <button onClick={() => handleSetCat(c.id, 'positive')} className={`flex-1 min-w-[80px] py-2 rounded-lg font-bold text-sm transition-colors shadow-sm ${commentCats[c.id] === 'positive' ? 'bg-green-500 text-white' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-600 hover:bg-green-50 dark:hover:bg-green-900/30'}`}>👍 Pos</button>
                                    <button onClick={() => handleSetCat(c.id, 'mixed')} className={`flex-1 min-w-[80px] py-2 rounded-lg font-bold text-sm transition-colors shadow-sm ${commentCats[c.id] === 'mixed' ? 'bg-amber-500 text-white' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-600 hover:bg-amber-50 dark:hover:bg-amber-900/30'}`}>⚖️ Mix</button>
                                    <button onClick={() => handleSetCat(c.id, 'negative')} className={`flex-1 min-w-[80px] py-2 rounded-lg font-bold text-sm transition-colors shadow-sm ${commentCats[c.id] === 'negative' ? 'bg-red-500 text-white' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-600 hover:bg-red-50 dark:hover:bg-red-900/30'}`}>👎 Neg</button>
                                 </div>
                                 {commentCats[c.id] && (
                                   <button onClick={() => handleSetCat(c.id, 'uncategorized')} className="w-full mt-3 py-2 text-xs font-bold text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-white transition-colors bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg shadow-sm">Clear Category</button>
                                 )}
                              </div>
                           )}
                        </div>
                     ))}
                  </div>
               )}
            </div>
         </div>
       )
    }

    function DepartmentDashboard({ responses, deptId, departments, flatDepartments, drillDown, setDrillDown, commentCats, setCommentCats, cqiReports, setCqiReports, legacy2025, legacy2026, setIframeUrl }) {
      const dept = departments.find(d => d.id === deptId) || flatDepartments.find(d => d.id === deptId);
      const isGrouped = dept?.type === 'checkbox';
      const [activeTab, setActiveTab] = useState('overview'); 
      const [activeSubDept, setActiveSubDept] = useState(isGrouped ? `${dept.id}_${dept.services[0]}` : null);
      const [statusUpdateReport, setStatusUpdateReport] = useState(null);

      const currentMonthKey = getMonthString(new Date());
      const [selectedMonth, setSelectedMonth] = useState(currentMonthKey);
      const [overviewMonth, setOverviewMonth] = useState(currentMonthKey);
      const [selectedArchiveMonth, setSelectedArchiveMonth] = useState('all');

      const targetDeptId = isGrouped ? activeSubDept : deptId;
      const targetDept = flatDepartments.find(d => d.id === targetDeptId);
      const [volumeViewMode, setVolumeViewMode] = useState('rate');

      const deptAllCommentsArray = useMemo(() => {
          const allComments = [];
          responses.forEach(res => {
              if (!res.departments) return;

              if (isGrouped) {
                  dept.services.forEach(svc => {
                      const subId = `${dept.id}_${svc}`;
                      const dData = res.departments[subId];
                      if (dData && !dData.skipped && dData.comment && dData.comment.trim() !== '') {
                          let rScore = 0, rCount = 0;
                          if (dData.answers) {
                              Object.values(dData.answers).forEach(s => { const num = Number(s)||0; if(num>0){rScore+=num; rCount++;} });
                          }
                          const fallbackTime = new Date(res.timestamp).getTime();
                          const uniqueId = `${res.id || fallbackTime}_${subId}`;
                          allComments.push({
                              id: uniqueId,
                              text: dData.comment,
                              date: res.timestamp,
                              score: rCount > 0 ? (rScore/rCount) : 0,
                              room: res.general?.queue_number || res.general?.room_number || 'Unknown',
                              deptName: `${dept.title} (${svc})`
                          });
                      }
                  });
              } else {
                  const dData = res.departments[targetDeptId];
                  if (dData && !dData.skipped && dData.comment && dData.comment.trim() !== '') {
                      let rScore = 0, rCount = 0;
                      if (dData.answers) {
                          Object.values(dData.answers).forEach(s => { const num = Number(s)||0; if(num>0){rScore+=num; rCount++;} });
                      }
                      const fallbackTime = new Date(res.timestamp).getTime();
                      const uniqueId = `${res.id || fallbackTime}_${targetDeptId}`;
                      allComments.push({
                          id: uniqueId,
                          text: dData.comment,
                          date: res.timestamp,
                          score: rCount > 0 ? (rScore/rCount) : 0,
                          room: res.general?.queue_number || res.general?.room_number || 'Unknown',
                          deptName: targetDept?.title || targetDeptId
                      });
                  }
              }
          });
          return allComments.sort((a,b) => new Date(b.date) - new Date(a.date));
      }, [responses, targetDeptId, dept, isGrouped]);

      const deptTodaysResponses = useMemo(() => {
        return responses.filter(r => {
            if(!r || !r.timestamp) return false;
            if(getMonthString(new Date(r.timestamp)) !== overviewMonth) return false;

            if (isGrouped) {
                let hasData = false;
                dept.services.forEach(svc => {
                    const subId = `${dept.id}_${svc}`;
                    if (r.departments && r.departments[subId] && !r.departments[subId].skipped) hasData = true;
                });
                return hasData;
            } else {
                return r.departments && r.departments[targetDeptId] && !r.departments[targetDeptId].skipped;
            }
        }).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      }, [responses, overviewMonth, targetDeptId, isGrouped, dept]);

      const deptFullYearData = useMemo(() => {
          const currentYear = new Date().getFullYear();
          const allMonthsKeys = Array.from({length: 12}, (_, i) => `${currentYear}-${String(i + 1).padStart(2, '0')}`);

          const deptsToTrack = isGrouped 
              ? dept.services.map(svc => ({ id: `${dept.id}_${svc}`, title: `${dept.title} (${svc})`, isSub: true }))
              : [{ id: targetDeptId, title: targetDept?.title || targetDeptId, isSub: false }];

          const stats = {};
          deptsToTrack.forEach(d => {
              stats[d.id] = { monthly: {} };
              allMonthsKeys.forEach(mk => stats[d.id].monthly[mk] = { score: 0, count: 0 });
          });

          responses.forEach(res => {
              if (!res || !res.timestamp || !res.departments) return;
              const resMonth = getMonthString(new Date(res.timestamp));
              if (!allMonthsKeys.includes(resMonth)) return;

              deptsToTrack.forEach(d => {
                  const dData = res.departments[d.id];
                  if (dData && !dData.skipped && dData.answers) {
                      Object.values(dData.answers).forEach(score => {
                          const numScore = Number(score) || 0;
                          if (numScore > 0) {
                              stats[d.id].monthly[resMonth].score += numScore;
                              stats[d.id].monthly[resMonth].count += 1;
                          }
                      });
                  }
              });
          });

          return deptsToTrack.map(d => {
              const monthlyAverages = allMonthsKeys.map(mk => {
                  const mStats = stats[d.id].monthly[mk];
                  const maxPossible = mStats.count * 3;
                  return maxPossible > 0 ? Math.min(Math.round((mStats.score / maxPossible) * 100), 100) : '-';
              });
              return { id: d.id, title: d.title, monthlyAverages, isSub: d.isSub };
          });
      }, [responses, targetDeptId, dept, isGrouped, targetDept]);

      const monthlyData = useMemo(() => {
        const currentYear = new Date().getFullYear();
        const allMonthsKeys = Array.from({length: 12}, (_, i) => `${currentYear}-${String(i + 1).padStart(2, '0')}`);

        const months = {}; 
        allMonthsKeys.forEach(mk => {
           const d = new Date(mk + "-01");
           months[mk] = { label: d.toLocaleString('default', { month: 'short', year: 'numeric' }), key: mk, totalScore: 0, count: 0, comments: [] };
        });

        const sentimentMonthly = {};
        allMonthsKeys.forEach(mk => { sentimentMonthly[mk] = { happy: 0, neutral: 0, sad: 0, total: 0 }; });

        responses.forEach(res => {
          if (!res.departments) return;
          let localScore = 0; let localCount = 0; let commentData = null;
          let hasAnsweredDept = false;
          let lowestDeptScore = 3;

          if (res.departments[targetDeptId] && !res.departments[targetDeptId].skipped && res.departments[targetDeptId].answers) {
             Object.values(res.departments[targetDeptId].answers).forEach(score => {
                const s = Number(score) || 0; 
                if (s > 0) { 
                    hasAnsweredDept = true; 
                    if (s < lowestDeptScore) lowestDeptScore = s;
                    localScore += s; 
                    localCount++; 
                }
             });
             commentData = res.departments[targetDeptId].comment;
          }

          const origDef = departments.find(d => d.id === targetDeptId);
          if (origDef && origDef.type === 'checkbox') {
             origDef.services.forEach(svc => {
                const subId = `${targetDeptId}_${svc}`;
                if (res.departments[subId] && !res.departments[subId].skipped && res.departments[subId].answers) {
                    Object.values(res.departments[subId].answers).forEach(score => {
                        const s = Number(score) || 0; 
                        if (s > 0) { 
                            hasAnsweredDept = true; 
                            if (s < lowestDeptScore) lowestDeptScore = s;
                            localScore += s; 
                            localCount++; 
                        }
                    });
                    if (res.departments[subId].comment) commentData = (commentData ? commentData + " | " : "") + res.departments[subId].comment;
                }
             });
          }

          if (localCount > 0) {
            const dateObj = new Date(res.timestamp); const monthKey = getMonthString(dateObj);
            if (months[monthKey]) {
                months[monthKey].totalScore += localScore; months[monthKey].count += localCount; 

                if (hasAnsweredDept) {
                    sentimentMonthly[monthKey].total++;
                    if (lowestDeptScore === 3) sentimentMonthly[monthKey].happy++;
                    else if (lowestDeptScore === 2) sentimentMonthly[monthKey].neutral++;
                    else if (lowestDeptScore === 1) sentimentMonthly[monthKey].sad++;
                }

                if (commentData && commentData.trim() !== '') {
                   const avg = (localScore/localCount); const fallbackTime = new Date(res.timestamp).getTime();
                   const uniqueId = `${res.id || fallbackTime}_${targetDeptId}`;
                   months[monthKey].comments.push({ id: uniqueId, text: commentData, date: res.timestamp, score: avg, room: res.general?.queue_number || res.general?.room_number || 'Unknown', deptName: targetDept?.title });
                }
            }
          }
        });

        return allMonthsKeys.map(key => {
          const d = months[key]; const maxPossible = d.count * 3;
          const satPct = maxPossible > 0 ? Math.min(Math.round((d.totalScore / maxPossible) * 100), 100) : 0;
          return { label: d.label, key: d.key, pct: satPct, count: d.count, comments: d.comments, sentiment: sentimentMonthly[key] };
        }); 
      }, [responses, targetDeptId, departments, targetDept]);

      const FALLBACK_MONTH_DATA = useMemo(() => ({ comments: [], label: '', pct: 0, count: 0, sentiment: { happy: 0, neutral: 0, sad: 0, total: 0 } }), []);
      const selectedMonthData = monthlyData.find(m => m.key === selectedMonth) || FALLBACK_MONTH_DATA;
      const selectedOverviewData = monthlyData.find(m => m.key === overviewMonth) || FALLBACK_MONTH_DATA;

      const sortedComments = useMemo(() => { return [...selectedMonthData.comments].sort((a,b) => new Date(b.date) - new Date(a.date)); }, [selectedMonthData]);

      const [reportData, setReportData] = useState([]);
      const [isSendingReport, setIsSendingReport] = useState(false);
      const [reportSuccess, setReportSuccess] = useState(false);
      const [reportError, setReportError] = useState(null);
      const [showTip, setShowTip] = useState(true);

      useEffect(() => {
         const negs = sortedComments.filter(c => commentCats[c.id] === 'negative');
         setReportData(prevData => {
            return negs.map(c => {
               const existingItem = prevData.find(item => item.id === c.id);
               return { id: c.id, date: isNaN(new Date(c.date).getTime()) ? c.date : new Date(c.date).toLocaleDateString('en-US'), text: c.text, Action: existingItem ? existingItem.Action : '', Eval: existingItem ? existingItem.Eval : '', Status: existingItem ? existingItem.Status : 'Pending' };
            });
         });
         setReportSuccess(false);
      }, [sortedComments, commentCats, selectedMonth]);

      const handleReportUpdate = (index, field, value) => { setReportData(prev => { const up = [...prev]; up[index] = { ...up[index], [field]: value }; return up; }); };

      const handleSendReport = async () => {
         setIsSendingReport(true); setReportError(null);
         const isZeroNegative = reportData.length === 0;
         const finalReportData = isZeroNegative ? [{ comment: "No negative feedback recorded for this period.", action: "Routine monitoring maintained.", evaluation: "N/A", status: "For Continuous Monitoring", date: new Date().toLocaleDateString('en-US') }] : reportData.map(r => ({ comment: r.text, action: r.Action, evaluation: r.Eval, status: r.Status, date: r.date }));

         try {
            const response = await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: "send_report", deptName: targetDept?.title, month: selectedMonth, reports: finalReportData }) });
            setTimeout(() => { setIsSendingReport(false); setReportSuccess(true); setReportData([]); }, 1500);
         } catch(e) { setIsSendingReport(false); setReportError("Failed to send report. Please check your internet connection and try again."); }
      };

      const hasNegativeComments = reportData.length > 0;
      const filteredCqiReports = cqiReports.filter(r => { let match = true; if (r.Department !== targetDept?.title) match = false; if (selectedArchiveMonth !== 'all' && r.Report_Month !== selectedArchiveMonth) match = false; return match; });

      return (
        <div className="bg-white dark:bg-slate-800 rounded-[2rem] shadow-xl border border-slate-200 dark:border-slate-700 print-dashboard relative transition-colors min-h-[75vh]">
          <div className="absolute inset-0 z-0 opacity-10 pointer-events-none hidden print:block rounded-[2rem] overflow-hidden" style={{backgroundImage: `url('${BACKGROUND_URL}')`, backgroundSize: 'cover', backgroundPosition: 'center'}} />
          <div className="relative z-10">
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center p-6 sm:p-12 border-b border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 transition-colors pb-6 sm:pb-8 sm:rounded-t-[2rem]">
              <div className="w-full">
                 <h2 className="text-3xl font-bold text-slate-900 dark:text-white font-serif">{isGrouped ? targetDept?.title : dept?.title}</h2>
                 <p className="text-slate-600 dark:text-slate-300 mt-1 font-medium">Departmental Performance Report</p>
                 {isGrouped && (

                                            <td className="p-3 align-top border-l border-slate-100 dark:border-slate-700">
                                               <select value={rep.Status} onChange={(e) => handleReportUpdate(i, 'Status', e.target.value)} className={`w-full p-2 rounded-xl border-2 outline-none font-bold text-[10px] sm:text-xs transition-colors text-center cursor-pointer ${rep.Status === 'Closed' ? 'bg-green-50 dark:bg-green-900/30 border-green-200 dark:border-green-800/50 text-green-700 dark:text-green-400' : 'bg-red-50 dark:bg-red-900/30 border-red-200 dark:border-red-800/50 text-red-700 dark:text-red-400'}`}>

                                                  <option value="For Continuous Monitoring" className="text-slate-900 font-bold">For Monitoring</option>
                                                  <option value="Closed" className="text-slate-900 font-bold">Closed</option>

                                      ))

                                </tbody>
                             </table>
                          </div>
                       </div>
                    )}
                    <button onClick={handleSendReport} disabled={isSendingReport} className="w-full sm:hidden mt-6 bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-xl font-bold flex items-center justify-center gap-3 transition-colors shadow-sm disabled:opacity-50">
                       {isSendingReport ? <><RefreshCw className="w-5 h-5 animate-spin" /> Sending...</> : <><Mail className="w-5 h-5" /> Submit Report</>}
                    </button>
                 </div>
              )}

              {activeTab === 'status reports compilation' && (
                 <div className="animate-in slide-in-from-bottom-2">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-2">
                       <div>
                         <h3 className="text-3xl font-black text-slate-800 dark:text-white font-serif flex items-center gap-3"><ClipboardList className="w-8 h-8 text-blue-600 dark:text-blue-400" /> Status Reports Compilation</h3>

                       </div>
                       <button onClick={() => window.print()} className="bg-slate-800 dark:bg-slate-700 text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 hover:bg-slate-700 dark:hover:bg-slate-600 shadow-md no-print"><Printer className="w-4 h-4" /> Print Archive</button>
                    </div>

                    <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-3xl overflow-hidden shadow-sm transition-colors">
                       <div className="overflow-x-auto custom-scrollbar report-table-wrapper">
                          <table className="w-full text-left table-fixed text-[9px] sm:text-[11px] break-words whitespace-normal print:text-[8px]">
                             <thead className="bg-slate-50 dark:bg-slate-900/50 text-slate-600 dark:text-slate-400 font-black uppercase tracking-wider border-b border-slate-200 dark:border-slate-700">
                                <tr>
                                   <th className="p-2 print:p-1 w-[12%]">Submission Date</th>
                                   <th className="p-2 print:p-1 w-[10%]">Month</th>
                                   <th className="p-2 print:p-1 w-[26%]">Case / Complaint</th>

                                      else if (rep.Status === 'Pending') statusColor = "text-red-700 dark:text-red-400 bg-red-50 dark:bg-red-900/30";

                                            <td className="p-2 print:p-1 align-top border-r border-slate-50 dark:border-slate-700/50">
                                               {isNaN(new Date(rep.Timestamp).getTime()) ? rep.Timestamp : new Date(rep.Timestamp).toLocaleString('en-US', {month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit'})}

                                            <td className="p-2 print:p-1 align-top break-words">
                                               <div className="font-bold text-slate-500 dark:text-slate-400 mb-1">Case {rep.Case_No}:</div>

                                            </td>
                                            <td className="p-2 print:p-1 align-top break-words">

                                               <div><span className="font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest text-[8px] block mb-1">Eval:</span> <span className="leading-relaxed">{rep.Evaluation || '-'}</span></div>
                                            </td>
                                            <td className="p-2 print:p-1 align-top text-center border-l border-slate-100 dark:border-slate-700">

                                                  <span className={`px-2 py-1.5 rounded-md text-[9px] print:text-[7px] font-black tracking-widest uppercase flex items-center justify-center text-center w-full break-words whitespace-normal border border-current leading-tight ${statusColor}`}>
                                                     {rep.Status}
                                                  </span>
                                                  <button onClick={() => setStatusUpdateReport(rep)} className="text-[10px] text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 font-bold flex items-center gap-1 justify-center w-full no-print bg-blue-50 dark:bg-slate-800 px-2 py-1 rounded-md border border-blue-200 dark:border-slate-700 transition-colors">
                                                     <Edit2 className="w-3 h-3" /> Edit Status
                                                  </button>

                                            </td>

                          </table>

                    </div>
                 </div>
              )}

              {activeTab === '2026 historical vault' && ( <LegacyVaultDashboard year="2026" legacyData={legacy2026} setIframeUrl={setIframeUrl} isAdmin={false} targetDeptId={targetDeptId} /> )}
              {activeTab === '2025 historical vault' && ( <LegacyVaultDashboard year="2025" legacyData={legacy2025} setIframeUrl={setIframeUrl} isAdmin={false} targetDeptId={targetDeptId} /> )}
            </div>
          </div>

          {statusUpdateReport && (
             <StatusUpdateModal 
                report={statusUpdateReport} 
                onClose={() => setStatusUpdateReport(null)} 
                onSuccess={(targetReport, newStatus, updateNote) => {
                   const updated = cqiReports.map(r => {
                      if (r.Timestamp === targetReport.Timestamp && r.Department === targetReport.Department && r.Case_No === targetReport.Case_No) {
                         const newEval = r.Evaluation ? `${r.Evaluation}\n\n[Update Note: ${updateNote}]` : `[Update Note: ${updateNote}]`;
                         return { ...r, Status: newStatus, Evaluation: newEval };
                      }
                      return r;
                   });
                   setCqiReports(updated);
                   localStorage.setItem('tdmh_opd_cqi_reports', JSON.stringify(updated));
                   setStatusUpdateReport(null);
                }} 
             />
          )}
        </div>
      );
    }

    function StatusUpdateModal({ report, onClose, onSuccess }) {
       const [password, setPassword] = useState('');
       const [newStatus, setNewStatus] = useState(report.Status || 'Pending');
       const [updateNote, setUpdateNote] = useState('');
       const [error, setError] = useState('');
       const [isSubmitting, setIsSubmitting] = useState(false);

       const [modalTop, setModalTop] = useState(0);
       const modalRef = useRef(null);

       useEffect(() => {
          const handleEsc = (e) => {
             if (e.key === 'Escape') onClose();
          };
          window.addEventListener('keydown', handleEsc);

          if (modalRef.current && modalRef.current.parentElement) {
             const parentRect = modalRef.current.parentElement.getBoundingClientRect();
             setModalTop(Math.max(0, -parentRect.top));
          }

          document.body.style.overflow = 'hidden';
          return () => { 
             window.removeEventListener('keydown', handleEsc);
             document.body.style.overflow = ''; 
          };
       }, [onClose]);

       const handleSubmit = async (e) => {
          e.preventDefault();
          if (!updateNote.trim()) { setError("Update note is required to explain the status change."); return; }
          setIsSubmitting(true); setError('');
          try {
             const url = `${APPS_SCRIPT_URL}?action=login&id=admin&name=Master%20Admin&password=${encodeURIComponent(password)}`;
             const res = await fetch(url); const data = await res.json();
             if (!data.success) { setError(data.message || 'Incorrect Admin Password'); setIsSubmitting(false); return; }

             const payload = { action: "update_report_status", timestamp: report.Timestamp, department: report.Department, caseNo: report.Case_No, newStatus: newStatus, updateNote: updateNote.trim() };
             fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) }).catch(e => console.log("Background sync error on status update:", e));

             onSuccess(report, newStatus, updateNote.trim());
          } catch(err) { setError("Network error verifying admin access. Please try again."); setIsSubmitting(false); }
       };

       return (
          <div 
             ref={modalRef}
             className="absolute z-[150] flex items-center justify-center p-4 duration-300 w-full animate-in fade-in"
             style={{ top: `${modalTop}px`, left: 0, height: '100vh', backgroundColor: 'rgba(15, 23, 42, 0.65)', backdropFilter: 'blur(8px)' }}
             onClick={onClose}
          >
             <div 
                className="bg-white dark:bg-slate-800 rounded-[2rem] shadow-2xl max-w-lg w-full overflow-hidden border border-slate-200 dark:border-slate-700 transition-colors animate-in zoom-in-95 duration-300 max-h-[95vh] flex flex-col"
                onClick={e => e.stopPropagation()}
             >
                <div className="p-6 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-900/50 shrink-0">
                   <h3 className="font-black text-xl font-serif text-slate-800 dark:text-white flex items-center gap-2"><Edit2 className="w-5 h-5 text-blue-500" /> Update Report Status</h3>
                   <button onClick={onClose} className="text-slate-400 hover:text-red-500 transition-colors bg-white dark:bg-slate-800 rounded-lg p-1.5 border border-slate-200 dark:border-slate-700 shadow-sm"><X className="w-5 h-5" /></button>
                </div>
                <div className="p-6 sm:p-8 overflow-y-auto custom-scrollbar">
                   <div className="mb-6 bg-blue-50 dark:bg-blue-900/20 p-4 rounded-xl border border-blue-100 dark:border-blue-800/50">
                      <p className="text-xs font-bold text-blue-600 dark:text-blue-400 uppercase tracking-widest mb-1">Target Report:</p>
                      <p className="font-bold text-slate-800 dark:text-slate-200">{report.Department} - Case {report.Case_No}</p>
                      <p className="text-sm text-slate-600 dark:text-slate-400 mt-1 line-clamp-2 italic">"{report.Complaint}"</p>
                   </div>
                   <form onSubmit={handleSubmit} className="space-y-5">
                      <div>
                         <label className="block text-xs font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest mb-2">New Status Selection</label>
                         <select value={newStatus} onChange={e => setNewStatus(e.target.value)} className="w-full p-4 rounded-xl border-2 border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-900 font-bold text-slate-700 dark:text-white outline-none focus:border-blue-500 transition-colors shadow-sm">
                            <option value="Pending">Pending</option>
                            <option value="For Continuous Monitoring">For Continuous Monitoring</option>
                            <option value="Closed">Closed</option>
                         </select>
                      </div>
                      <div>
                         <label className="block text-xs font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest mb-2">Update Note / Reason</label>
                         <textarea value={updateNote} onChange={e => setUpdateNote(e.target.value)} className="w-full p-4 rounded-xl border-2 border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-900 font-medium text-sm text-slate-700 dark:text-white outline-none focus:border-blue-500 transition-colors shadow-sm resize-none" rows="3" placeholder="Why is this status being overridden? This note will be appended to the evaluation..." required></textarea>
                      </div>
                      <div className="pt-4 border-t border-slate-100 dark:border-slate-700">
                         <label className="block text-xs font-black text-red-500 dark:text-red-400 uppercase tracking-widest mb-2 flex items-center gap-1"><ShieldAlert className="w-3 h-3"/> Verify Admin Access</label>
                         <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full p-4 rounded-xl border-2 border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-900 text-lg text-slate-700 dark:text-white outline-none focus:border-red-500 transition-colors shadow-sm" placeholder="Enter Master Admin Password" required />
                      </div>
                      {error && <p className="text-red-500 dark:text-red-400 text-sm mt-2 font-bold flex items-center gap-1 bg-red-50 dark:bg-red-900/30 p-3 rounded-lg"><AlertTriangle className="w-4 h-4"/>{error}</p>}
                      <button type="submit" disabled={isSubmitting || newStatus === report.Status} className="w-full text-white font-black py-4 rounded-xl text-lg transition-colors active:scale-95 flex justify-center items-center gap-2 disabled:opacity-50 shadow-md mt-4 bg-blue-600 hover:bg-blue-700 border border-blue-500 shrink-0">
                         {isSubmitting ? <><RefreshCw className="w-5 h-5 animate-spin" /> Verifying & Updating...</> : 'Confirm & Update Status'}
                      </button>
                   </form>
                </div>
             </div>
          </div>
       )
    }

    function LegacyVaultDashboard({ year, legacyData, setIframeUrl, isAdmin, targetDeptId }) {
       const [vaultTab, setVaultTab] = useState('native_overview');
       const [overviewMonth, setOverviewMonth] = useState('all');
       const [volumeViewMode, setVolumeViewMode] = useState('rate'); 

       const [visibleComments, setVisibleComments] = useState(50);

       useEffect(() => { setVisibleComments(50); }, [overviewMonth, vaultTab]);

       const analytics = useMemo(() => {
          const ratingsMonthly = {};
          for(let i=1; i<=12; i++) {
             ratingsMonthly[`${year}-${String(i).padStart(2,'0')}`] = { happy: 0, neutral: 0, sad: 0, total: 0 };
          }

          if (!legacyData?.data) return { months: {}, comments: [], totalCensus: 0, overallSatPct: 0, insightCounts: {q1: { Yes: 0, No: 0 }, q2: { Superior: 0, 'At Par': 0, Inferior: 0 }, q3: { Yes: 0, No: 0 }}, ratingsMonthly };

          const monthsData = {};
          const allComments = [];
          const insightCounts = {
             q1: { Yes: 0, No: 0 },
             q2: { Superior: 0, 'At Par': 0, Inferior: 0 },
             q3: { Yes: 0, No: 0 }
          };

          let totalPoints = 0;
          let maxPoints = 0;

          legacyData.data.forEach((row, index) => {
             const rawDate = row["Timestamp"];
             const dateObj = new Date(rawDate);
             if (isNaN(dateObj.getTime())) return;
             const monthKey = getMonthString(dateObj);
             if (monthKey.indexOf(year) === -1) return; 

             if (!monthsData[monthKey]) monthsData[monthKey] = { count: 0, score: 0, max: 0 };
             monthsData[monthKey].count += 1;

             // Extracting the rating from the old Google Forms column
             const ratingKey = Object.keys(row).find(k => {
                 const cleanK = k.toLowerCase().replace(/[^a-z0-9]/g, '');
                 return cleanK.includes('rate') || cleanK.includes('quality') || cleanK.includes('satisf');
             });
             
             const ratingStr = ratingKey ? String(row[ratingKey] || "").trim().toLowerCase() : "";
             
             let rowPoints = 0;
             let rowMax = 0;

             // Catch "Happy", "Neutral", "Sad", OR numerical equivalents
             if(ratingStr.includes('happy') || ratingStr === '3') { 
                 rowPoints = 3; rowMax = 3; 
                 ratingsMonthly[monthKey].happy++; ratingsMonthly[monthKey].total++; 
             }
             else if(ratingStr.includes('neutral') || ratingStr === '2') { 
                 rowPoints = 2; rowMax = 3; 
                 ratingsMonthly[monthKey].neutral++; ratingsMonthly[monthKey].total++; 
             }
             else if(ratingStr.includes('sad') || ratingStr === '1') { 
                 rowPoints = 1; rowMax = 3; 
                 ratingsMonthly[monthKey].sad++; ratingsMonthly[monthKey].total++; 
             }

             monthsData[monthKey].score += rowPoints;
             monthsData[monthKey].max += rowMax;
             totalPoints += rowPoints;
             maxPoints += rowMax;

             // Extracting the comment
             const commentKey = Object.keys(row).find(k => k.toLowerCase().includes('comments or suggestions'));
             const rawComment = commentKey ? row[commentKey] : "";
             
             if (rawComment && rawComment.trim().length > 0) {
                 const nameKey = Object.keys(row).find(k => k.toLowerCase().includes('complete name'));
                 allComments.push({
                    id: `legacy_${year}_${index}`,
                    date: rawDate,
                    name: nameKey ? (row[nameKey] || "Anonymous") : "Anonymous",
                    text: rawComment
                 });
             }

             const v1 = row["Have you visited or have you been admitted to another hospital?"];
             if (v1 === 'Yes') insightCounts.q1.Yes++; else if (v1 === 'No') insightCounts.q1.No++;

             const v2 = row["How do you compare Taytay Doctors Multispecialty Hospital to other hospitals?"];
             if (v2 === 'Superior') insightCounts.q2.Superior++; 
             else if (v2 === 'At Par') insightCounts.q2['At Par']++; 
             else if (v2 === 'Inferior') insightCounts.q2.Inferior++;

             const v3 = row["Do you want to receive health tips and service updates from Taytay Doctors Multispecialty Hospital?"];
             if (v3 === 'Yes') insightCounts.q3.Yes++; else if (v3 === 'No') insightCounts.q3.No++;
          });

          return { 
             months: monthsData, 
             comments: allComments.reverse(), 
             totalCensus: legacyData.data.length,
             overallSatPct: maxPoints > 0 ? Math.round((totalPoints / maxPoints) * 100) : 0,
             insightCounts,
             ratingsMonthly
          };
       }, [legacyData, year]);

       let displayCensus = analytics.totalCensus;
       let displaySat = analytics.overallSatPct;
       let displayedComments = analytics.comments;

       if (overviewMonth !== 'all' && analytics.months[overviewMonth]) {
          displayCensus = analytics.months[overviewMonth].count;
          const mData = analytics.months[overviewMonth];
          displaySat = mData.max > 0 ? Math.round((mData.score / mData.max) * 100) : 0;
          displayedComments = analytics.comments.filter(c => getMonthString(new Date(c.date)) === overviewMonth);
       } else if (overviewMonth !== 'all') {
          displayCensus = 0; displaySat = 0;
          displayedComments = [];
       }

       return (
          <div className="animate-in slide-in-from-bottom-2 space-y-10 no-print">

             <div className="bg-gradient-to-r from-slate-900 to-slate-800 text-white p-8 sm:p-10 rounded-[2rem] shadow-xl border border-slate-700 flex flex-col sm:flex-row justify-between items-center gap-6 relative overflow-hidden">
                <div className="absolute top-0 right-0 p-10 opacity-10 pointer-events-none"><Database className="w-40 h-40" /></div>
                <div className="relative z-10 w-full">
                   <h3 className="text-3xl font-black font-serif flex items-center gap-3"><FileText className="w-8 h-8 text-amber-400" /> {year} Legacy Archive</h3>
                   <p className="text-slate-300 mt-2 font-medium text-lg max-w-2xl">A secure, read-only vault of your finalized Google Forms OPD data.</p>

                   <div className="flex flex-wrap gap-2 mt-6 bg-slate-800 p-2 rounded-2xl border border-slate-600 inline-flex w-full sm:w-auto">
                      <button onClick={() => setVaultTab('native_overview')} className={`px-6 py-2.5 rounded-xl text-sm font-bold transition-all ${vaultTab === 'native_overview' ? 'bg-amber-500 text-slate-900 shadow-md' : 'text-slate-400 hover:text-white hover:bg-slate-700'}`}>Native Dashboard</button>
                      <button onClick={() => setVaultTab('native_feedback')} className={`px-6 py-2.5 rounded-xl text-sm font-bold transition-all ${vaultTab === 'native_feedback' ? 'bg-amber-500 text-slate-900 shadow-md' : 'text-slate-400 hover:text-white hover:bg-slate-700'}`}>Raw Feedback List</button>
                   </div>
                </div>
             </div>

             {vaultTab === 'native_overview' && (
                <div className="space-y-8 animate-in fade-in slide-in-from-bottom-4">

                            <option value="all">Full Year {year}</option>

                   </div>

                   <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      <div className="bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800/50 p-8 rounded-3xl shadow-sm flex flex-col justify-center">

                            <p className="text-4xl sm:text-5xl lg:text-6xl font-black text-amber-900 dark:text-amber-100 truncate">{displayCensus}</p>
                         </div>
                         <p className="text-xs font-bold text-amber-600 dark:text-amber-400 mt-4 tracking-wide leading-relaxed">Auto-calculated from raw rows.</p>

                      <div className="bg-indigo-50 dark:bg-indigo-900/30 border border-indigo-200 dark:border-indigo-800/50 p-8 rounded-3xl shadow-sm flex flex-col justify-center relative group">
                         <p className="text-indigo-800 dark:text-indigo-300 font-bold uppercase tracking-wide text-sm mb-2">Satisfaction Rate ({overviewMonth === 'all' ? year : overviewMonth})</p>
                         <div className="flex items-baseline gap-4 mt-2">
                            <p className="text-4xl sm:text-5xl lg:text-6xl font-black text-indigo-900 dark:text-indigo-100 truncate">{displaySat}%</p>

                      <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">

                             <button 
                                 onClick={() => setVolumeViewMode('rate')} 
                                 className={`px-4 py-2 rounded-lg text-sm font-bold transition-all flex items-center gap-2 ${volumeViewMode === 'rate' ? 'bg-white dark:bg-slate-700 text-amber-600 dark:text-amber-400 shadow-sm' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-300'}`}

                      <div className="flex items-end justify-between gap-1 sm:gap-4 h-[400px] sm:h-[500px] border-b-4 border-slate-100 dark:border-slate-700 pb-2 relative">

                            const mk = `${year}-${String(index+1).padStart(2,'0')}`;
                            const count = analytics.months[mk]?.count || 0;
                            const isCurrent = overviewMonth === 'all' ? true : mk === overviewMonth;

                            const maxVol = Math.max(...Object.values(analytics.months).map(m=>m.count), 1);
                            const heightPctVolume = count > 0 ? (count / maxVol) * 100 : 0;

                            const ratingsData = analytics.ratingsMonthly[mk] || { happy: 0, neutral: 0, sad: 0, total: 0 };
                            const maxSent = Math.max(...Object.values(analytics.ratingsMonthly).map(s => s.total), 1);

                            const happyHeight = ratingsData.total > 0 ? (ratingsData.happy / maxSent) * 100 : 0;
                            const neutralHeight = ratingsData.total > 0 ? (ratingsData.neutral / maxSent) * 100 : 0;
                            const sadHeight = ratingsData.total > 0 ? (ratingsData.sad / maxSent) * 100 : 0;
                            const totalHeightSentiment = happyHeight + neutralHeight + sadHeight;

                            return (
                               <div key={mk} className="flex flex-col items-center flex-1 h-full justify-end group min-w-[20px]">
                                  <div className={`flex flex-col items-center mb-3 text-center transition-opacity ${isCurrent ? 'opacity-100' : 'opacity-70 group-hover:opacity-100'}`}>

                                           <span className={`text-sm sm:text-xl font-black ${isCurrent ? 'text-amber-600 dark:text-amber-400' : 'text-slate-700 dark:text-slate-300'}`}>{ratingsData.total === 0 ? '-' : ratingsData.total}</span>
